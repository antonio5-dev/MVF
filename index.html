/* lê só categoria, descrição, valor e data */
function lerBasico(tp,old){
  const catv=$('cat').value;let catNome;
  if(catv==='__rend')catNome='Rendimento de investimento';
  else if(catv==='__cur')catNome=old?old.cat:'Outros';
  else{const c=catsDe(tp).find(x=>x.id===catv);if(!c){alert('Escolha uma categoria.');return null}catNome=c.nome}
  const desc=$('d').value.trim()||catNome,valor=r2(num($('v').value)),data=$('dt2').value;
  if(valor<=0||!data){alert('Preencha valor e data.');return null}
  return{catv,catNome,desc,valor,data};
}
/* lê o formulário inteiro e devolve o registro */
function lerForm(tp,old){
  const b=lerBasico(tp,old);if(!b)return null;
  const meio=$('meio').value;
  if(tp==='out'&&b.data>today()){
    alert('Saída no futuro: registre como Dívida (tela Dívidas). Aqui só entram saídas que já aconteceram.');
    return null;
  }
  const m={id:old?old.id:uid(),tipo:tp,desc:b.desc,valor:b.valor,data:b.data,cat:b.catNome};
  if(old&&old.rcat){m.rcat=old.rcat;m.rmes=old.rmes}
  if(b.catv==='__rend'||meio==='rend'){
    if(!$('refi')){alert('Selecione um investimento.');return null}
    m.rend=$('refi').value;m.meio='rend';
  }else{
    m.meio=meio;
    if(meio==='conta'){if(!$('refs')){alert('Cadastre uma conta antes.');return null}m.ref=$('refs').value}
  }
  return m;
}
function addMov(tp){
  const m=lerForm(tp);if(!m)return;
  if(tp==='in'&&fut(m))m.pend=true;else efeito(m,1);
  S.movs.push(m);save();render();
}
function viaMov(m){
  let via;
  if(m.rend)via='Investimento → '+(find('inv',m.rend)?.nome||'(removido)');
  else if(m.meio==='dinheiro')via='Dinheiro';
  else if(m.meio==='conta')via='Conta: '+(find('contas',m.ref)?.nome||'(removida)');
  else via=m.meio||'';
  if(m.rcat)via+=' · 🔁 automático';
  if(m.autoDeb)via+=' · 🔁 débito automático';
  if(m.auto)via+=' · automático (já incluso no resgate)';
  return via;
}
function listaMov(ms,asc){
  if(!ms.length)return '<p class="sub">Nenhum registro.</p>';
  return ms.slice().sort((a,b)=>asc?a.data.localeCompare(b.data):b.data.localeCompare(a.data)).map(m=>{
    const cls=m.pend?'':m.tipo==='in'?'pos':'neg';
    const fu=m.pend?`<br><small class="warn">⏳ Lançamento futuro - ${fdate(m.data)}</small>`:'';
    return `<div class="card row${m.pend?' muted':''}"><div><b>${esc(m.desc)}</b>${fu}<br><small>${fdate(m.data)} · ${esc(m.cat||'')} · ${esc(viaMov(m))}</small></div>
    <div style="white-space:nowrap"><b class="${cls}">${m.tipo==='in'?'+':'−'}${brl(m.valor)}</b><button class="ic" onclick="editaMov('${m.id}')">✎</button><button class="ic" onclick="delMov('${m.id}')">🗑</button></div></div>`}).join('');
}
function delMov(id){
  const m=S.movs.find(x=>x.id===id);if(!m)return;
  if(!confirm('Excluir o registro? Os saldos serão revertidos.'))return;
  if(!m.pend)efeito(m,-1);
  desfazPag(m);
  S.movs=S.movs.filter(x=>x.id!==id);save();render();
}

/* ---------- EDIÇÃO DE REGISTROS ---------- */
function modoEdit(m){
  if(m.pgs)return 'pag';
  if(m.sem)return 'info';
  return 'full';
}
function editaMov(id){
  const m=find('movs',id);if(!m)return;
  editId=id;editTp=m.tipo;go('editmov');
}
function prefillEdit(){
  const m=find('movs',editId);if(!m)return;
  const tp=m.tipo;let cv;
  if(tp==='in'&&m.cat==='Rendimento de investimento')cv='__rend';
  else{
    const c=catsDe(tp).find(x=>x.nome===m.cat);
    if(c)cv=c.id;
    else{cv='__cur';const o=document.createElement('option');o.value='__cur';o.textContent=m.cat+' (categoria removida)';$('cat').appendChild(o)}
  }
  $('cat').value=cv;
  $('d').value=m.desc;$('v').value=m.valor;$('dt2').value=m.data;
  $('meio').value=m.meio==='rend'?(cv==='__rend'?'dinheiro':'rend'):m.meio;
  updForm();
  if(m.rend&&$('refi'))$('refi').value=m.rend;
  if(m.meio==='conta'&&$('refs'))$('refs').value=m.ref;
  hintSaida();
  if(editMode==='pag')$('v').disabled=true;
}
function salvaEdit(){
  const old=find('movs',editId);if(!old)return go(editTp==='in'?'entradas':'saidas');
  const mode=modoEdit(old),tp=old.tipo;
  if(mode==='info'){
    const b=lerBasico(tp,old);if(!b)return;
    old.desc=b.desc;old.cat=b.catNome;old.valor=b.valor;old.data=b.data;
    save();return back();
  }
  const nm=lerForm(tp,old);if(!nm)return;
  if(mode==='pag'){
    if(nm.meio==='rend'){alert('Um pagamento só pode sair de uma conta ou do dinheiro.');return}
    efeito(old,-1);
    if(nm.desc!==old.desc)old.dman=1;
    (old.pgs||[]).forEach(pg=>{const dv=find('dividas',pg.d);if(dv)dv.cat=nm.cat});
    old.desc=nm.desc;old.cat=nm.cat;old.data=nm.data;old.meio=nm.meio;
    if(nm.meio==='conta')old.ref=nm.ref;else delete old.ref;
    efeito(old,1);save();return back();
  }
  const i=S.movs.findIndex(x=>x.id===old.id);
  if(!old.pend)efeito(old,-1);
  if(tp==='in'&&fut(nm))nm.pend=true;else efeito(nm,1);
  S.movs[i]=nm;save();back();
}
/* apagar tudo: só o tema é mantido (o nome também é apagado) */
function apagar(){
  if(confirm('Apagar TODOS os dados?')&&confirm('Tem certeza? Esta ação não pode ser desfeita.')){
    const t=S.tema;S=DEF();S.tema=t;save();go('home');
  }
}

/* ---------- GRÁFICOS (pizza e barras em SVG, funcionam offline) ---------- */
const PAL=['#4ea8de','#8fd6a4','#e3c37a','#e88f8f','#b79ced','#6fd3c8','#f2a65a','#d985b8'];
const CT_APP=()=>({hide:S.hide,bg:'var(--card)',tx:'var(--tx)',mut:'var(--mut)',ln:'var(--bd)'});
const CT_EXP={hide:false,bg:'#fff',tx:'#16302b',mut:'#64748b',ln:'#cbd5d1'};
const mshort=ym=>{const [y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')};
function fk(v){
  const a=Math.abs(v),s=v<0?'-':'';
  if(a>=1e6)return s+(a/1e6).toFixed(1).replace('.',',')+' mi';
  if(a>=1e3)return s+Math.round(a/1e3)+' mil';
  return s+Math.round(a);
}
function pieHTML(data,o){
  let P=data.filter(x=>x.v>0.004).sort((a,b)=>b.v-a.v);
  if(!P.length)return '<p class="sub" style="margin:4px 0">Sem dados para o gráfico neste período.</p>';
  if(P.length>8){const rest=P.slice(7);P=P.slice(0,7).concat([{l:'Demais ('+rest.length+')',v:sumv(rest.map(x=>x.v)),dem:1}])}
  const tot=sumv(P.map(x=>x.v)),C=100,R=86,RH=52;
  const mv=v=>o.hide?'R$ ••••':fmt(v);
  const col=i=>P[i].dem?'#8f8f8f':PAL[i];
  let ang=-Math.PI/2,sl='';
  if(P.length===1)sl=`<circle cx="${C}" cy="${C}" r="${R}" style="fill:${col(0)}"/>`;
  else P.forEach((x,i)=>{
    const a=x.v/tot*2*Math.PI,a2=ang+a;
    const x1=(C+R*Math.cos(ang)).toFixed(2),y1=(C+R*Math.sin(ang)).toFixed(2),x2=(C+R*Math.cos(a2)).toFixed(2),y2=(C+R*Math.sin(a2)).toFixed(2);
    sl+=`<path d="M${C} ${C}L${x1} ${y1}A${R} ${R} 0 ${a>Math.PI?1:0} 1 ${x2} ${y2}Z" style="fill:${col(i)};stroke:${o.bg};stroke-width:2"/>`;
    ang=a2;
  });
  const tt=mv(tot),fs=tt.length>13?9:11;
  const svg=`<svg viewBox="0 0 200 200" style="width:100%;max-width:230px;display:block;margin:0 auto 8px" role="img" aria-label="Gráfico de pizza">${sl}
  <circle cx="${C}" cy="${C}" r="${RH}" style="fill:${o.bg}"/>
  <text x="${C}" y="${C-5}" text-anchor="middle" style="fill:${o.mut};font-size:10px">Total</text>
  <text x="${C}" y="${C+11}" text-anchor="middle" style="fill:${o.tx};font-size:${fs}px;font-weight:600">${tt}</text></svg>`;
  const leg=P.map((x,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;color:${o.tx}">
    <span style="width:10px;height:10px;border-radius:50%;background:${col(i)};flex:none"></span>
    <span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(x.l)}</span>
    <span style="white-space:nowrap">${mv(x.v)}</span>
    <span style="width:48px;text-align:right;color:${o.mut}">${(x.v/tot*100).toFixed(1).replace('.',',')}%</span></div>`).join('');
  return svg+leg;
}
function barHTML(data,o){
  if(!data.length)return '<p class="sub" style="margin:4px 0">Sem dados para o gráfico neste período.</p>';
  const W=320,H=190,pt=18,pb=34,n=data.length,gw=(W-12)/n,bw=Math.min(30,gw*.7);
  const vals=data.map(x=>x.v),lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=(hi-lo)||1,ih=H-pt-pb;
  const Y=v=>pt+(hi-v)/rg*ih,y0=Y(0);
  let s=`<line x1="6" x2="${W-6}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" style="stroke:${o.ln};stroke-width:1"/>`;
  data.forEach((x,i)=>{
    const cx=6+gw*i+gw/2,top=Y(Math.max(x.v,0)),bot=Y(Math.min(x.v,0)),h=Math.max(bot-top,1);
    s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" style="fill:${x.sel?'#8fd6a4':'#4ea8de'}"/>`;
    if(!o.hide)s+=`<text x="${cx.toFixed(1)}" y="${(x.v>=0?top-3:bot+9).toFixed(1)}" text-anchor="middle" style="fill:${o.tx};font-size:7px">${fk(x.v)}</text>`;
    s+=`<text x="${cx.toFixed(1)}" y="${H-pb+12}" text-anchor="middle" style="fill:${o.tx};font-size:8px">${esc(x.l)}</text>
    <text x="${cx.toFixed(1)}" y="${H-pb+22}" text-anchor="middle" style="fill:${o.mut};font-size:7px">${esc(x.y)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="Gráfico de barras">${s}</svg>`;
}
const chartHTML=(c,o)=>c.kind==='bar'?barHTML(c.data,o):pieHTML(c.data,o);
function chartsTela(r){
  return (r.charts||[]).map(c=>`<div class="card"><b>${esc(c.h)}</b><div style="margin-top:8px">${chartHTML(c,CT_APP())}</div>${c.nota?`<p class="sub" style="margin:6px 0 0">${esc(c.nota)}</p>`:''}</div>`).join('');
}
const totSnap=sn=>r2(sumv(sn.contas.map(c=>c.v))+sn.din+sumv(sn.inv.map(i=>i.v)));
function serieMeses(mes,n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const k=addM(mes,-i),sn=snapDe(k);
    if(!sn)continue;
    out.push({l:mshort(k),y:k.slice(2,4),v:totSnap(sn),sel:k===mes});
  }
  return out;
}
const notaNeg=list=>list.some(x=>x.v<0)?'Valores negativos (por exemplo, conta no vermelho) não aparecem no gráfico.':'';

/* ---------- RELATÓRIOS ---------- */
function mudaMesH(i){mesH=addM(mesH,i);render()}
function setMesH(v){if(v){mesH=v;render()}}
function setTab(t){tabH=t;render()}
const SEM_SNAP='Sem registro de saldos neste mês. O app passou a guardar os saldos mensais a partir da primeira vez que foi aberto com a versão que guarda o histórico.';
function obsSnap(mes,sn){
  if(!sn)return '';
  if(sn.est)return 'Mês sem uso do app: os valores repetem o último registro anterior.';
  return mes===cur()?'Mês em andamento: valores atuais.':'Saldos do fim do mês = saldos do último dia em que o app foi usado neste mês.';
}
const nts=futv=>futv>0?[{t:'+ {v} a receber (lançamento futuro)',v:futv}]:[];
function agrupaCat(ms,tp){
  const mp={};
  ms.filter(m=>m.tipo===tp).forEach(m=>{const k=m.cat||'Outros';(mp[k]=mp[k]||[]).push(m)});
  return Object.keys(mp).map(cat=>{
    const its=mp[cat].slice().sort((a,b)=>b.data.localeCompare(a.data));
    return{cat,its,
      total:sumv(its.filter(m=>!m.pend).map(m=>m.valor)),
      fut:sumv(its.filter(m=>m.pend).map(m=>m.valor))};
  }).sort((a,b)=>(b.total+b.fut)-(a.total+a.fut));
}
function linhasCat(ms,tp,tot){
  const g=agrupaCat(ms,tp);
  if(!g.length)return[{a:'Nenhum registro neste mês.'}];
  return g.map(x=>({a:x.cat,v:x.total,notes:nts(x.fut),
    sub:x.its.map(m=>({a:fdate(m.data)+' · '+m.desc+' · '+viaMov(m)+(m.pend?' · lançamento futuro':''),v:m.valor,mut:!!m.pend}))}))
    .concat([{a:'Total',v:tot,total:1}]);
}
function relRes(mes){
  const ms=S.movs.filter(m=>m.data.slice(0,7)===mes);
  const ent=ms.filter(m=>m.tipo==='in'),sai=ms.filter(m=>m.tipo==='out');
  const E=totMov(ent),Sd=totMov(sai),futE=sumv(ent.filter(m=>m.pend).map(m=>m.valor));
  const rows=[{a:'Entradas',v:E,c:'pos'},{a:'Saídas',v:Sd,c:'neg'},{a:'Saldo do mês',v:r2(E-Sd),total:1}];
  if(futE>0)rows.push({a:'A receber (lançamentos futuros, não somados acima)',v:futE});
  const cats=tp=>{const g=agrupaCat(ms,tp);return g.length?g.map(x=>({a:x.cat,v:x.total,notes:nts(x.fut)})):[{a:'Nenhum registro neste mês.'}]};
  return{titulo:'Resumo · '+mlabel(mes),nome:'resumo',obs:'',secs:[
    {h:'Resumo do mês',rows},
    {h:'Entradas por categoria',rows:cats('in')},
    {h:'Saídas por categoria',rows:cats('out')}]};
}
function relLista(mes,tp){
  const ms=S.movs.filter(m=>m.data.slice(0,7)===mes),tot=totMov(ms.filter(m=>m.tipo===tp));
  const nome=tp==='in'?'Entradas':'Saídas';
  const g=agrupaCat(ms,tp);
  return{titulo:nome+' · '+mlabel(mes),nome:tp==='in'?'entradas':'saidas',obs:'',
    charts:[{kind:'pie',h:nome+' por categoria',data:g.map(x=>({l:x.cat,v:x.total}))}],
    secs:[
    {h:'Total do mês',rows:[{a:'Total de '+nome.toLowerCase(),v:tot,c:tp==='in'?'pos':'neg'}]},
    {h:nome+' por categoria',rows:linhasCat(ms,tp,tot)}]};
}
function relDiv(mes){
  const its=itens(()=>true,ateM(mes)).filter(x=>x.mes===mes);
  const st=x=>x.paga?' · paga':(atrasada(x)?' · EM ATRASO':' · em aberto');
  const lin=x=>({a:x.d.nome+' ('+(x.d.cat||'Outros')+') · '+(x.d.kind==='assin'?'assinatura/recorrente':'parcela '+(x.i+1)+'/'+x.d.n)+(!x.d.cartao&&vDia(x.d)?' · vence '+vData(mes,vDia(x.d)):'')+st(x),v:x.valor,mut:x.paga});
  const tot=sumv(its.map(x=>x.valor)),ab=sumv(its.filter(x=>!x.paga).map(x=>x.valor)),atrM=sumv(its.filter(atrasada).map(x=>x.valor));
  const r=resumo(()=>true);
  const cartRows=S.cartoes.map(k=>{
    const L2=its.filter(x=>x.d.cartao===k.id);
    if(!L2.length)return{a:k.nome+' · sem cobranças neste mês'};
    const nt=[{t:'em aberto: {v}',v:sumv(L2.filter(x=>!x.paga).map(x=>x.valor))}];
    const at=sumv(L2.filter(atrasada).map(x=>x.valor));
    if(at>0)nt.push({t:'EM ATRASO: {v}',v:at});
    return{a:k.nome+(k.venc?' · vence '+vData(mes,k.venc):'')+(k.auto?' · débito automático':''),v:sumv(L2.map(x=>x.valor)),notes:nt,sub:L2.map(lin)};
  });
  const outras=its.filter(x=>!x.d.cartao).map(x=>({a:lin(x).a+(x.d.auto?' · débito automático':''),v:x.valor,mut:x.paga}));
  const pg=S.movs.filter(m=>m.pgs&&m.data.slice(0,7)===mes).sort((a,b)=>a.data.localeCompare(b.data));
  const pgRows=pg.length?[{a:'Pagamentos efetuados no mês',v:sumv(pg.map(m=>m.valor)),sub:pg.map(m=>({a:fdate(m.data)+' · '+m.desc+' ('+(m.cat||'Outros')+')'+(m.autoDeb?' · débito automático':' · pago pelo app'),v:m.valor}))}]:[{a:'Nenhum pagamento neste mês.'}];
  /* gráfico: cada cartão e cada uma das outras dívidas, nas cobranças do mês */
  const mp={};
  const soma=(chave,l,v)=>{(mp[chave]=mp[chave]||{l,v:0}).v+=v};
  its.forEach(x=>{
    const cat=x.d.cat||'Outros',ck=x.d.cartao?find('cartoes',x.d.cartao):null;
    if(ck)soma('k:'+ck.id+':'+cat,'💳 '+ck.nome+' · '+cat,x.valor);
    else soma('d:'+x.d.id,x.d.nome+' · '+cat,x.valor);
  });
  const dataPie=Object.keys(mp).map(k=>({l:mp[k].l,v:r2(mp[k].v)}));
  return{titulo:'Dívidas e cartões · '+mlabel(mes),nome:'dividas-cartoes',
    obs:'A situação paga/em aberto/em atraso é a atual. Quando pagas, as dívidas entram em Saídas na categoria indicada entre parênteses.',
    charts:[{kind:'pie',h:'Cobranças de '+mlabel(mes)+' por cartão e dívida, com a categoria de cada uma',data:dataPie}],
    secs:[
    {h:'Resumo do mês',rows:[
      {a:'Cobranças do mês (cartões e dívidas)',v:tot},
      {a:'Pagas',v:r2(tot-ab),c:'pos'},
      {a:'Em aberto',v:ab,c:'neg'},
      {a:'Em atraso (neste mês)',v:atrM,c:atrM>0?'neg':''},
      {a:'Total em aberto hoje (todas as cobranças)',v:r.total,total:1},
      {a:'Total em atraso hoje',v:r.atraso,c:r.atraso>0?'neg':''},
      {a:'Assinaturas e recorrentes ativos (por mês)',v:r.ass}]},
    {h:'Cartões de crédito',rows:cartRows.length?cartRows:[{a:'Nenhum cartão cadastrado.'}]},
    {h:'Outras dívidas (financiamentos, aluguel etc.)',rows:outras.length?outras:[{a:'Nenhuma cobrança neste mês.'}]},
    {h:'Pagamentos efetuados',rows:pgRows}]};
}
const catAcoes=tp=>{const c=(S.cats[tp]||[]).find(x=>x.id===(tp==='in'?'ci3':'co5'));return c?c.nome:'Ações'};
function relAcoes(mes){
  const ym=d=>d.slice(0,7)===mes;
  const ms=S.movs.filter(m=>(m.auto||m.cat===catAcoes(m.tipo))&&ym(m.data));
  const real=ms.filter(m=>!m.pend);
  const gan=real.filter(m=>m.tipo==='in'),per=real.filter(m=>m.tipo==='out'&&m.auto),tar=real.filter(m=>m.tipo==='out'&&!m.auto);
  const G=sumv(gan.map(m=>m.valor)),P=sumv(per.map(m=>m.valor)),T=sumv(tar.map(m=>m.valor)),liq=r2(G-P-T);
  const ev=[];
  S.ops.filter(o=>o.q&&ym(o.data)).forEach(o=>{
    const i=opInvest(o),c=opConta(o);
    ev.push({d:o.data,o:0,a:(o.dir==='inv'?'Compra de ':'Venda de ')+(i?i.nome:o.inv)+' · '+o.q+' un. × '+fmt(o.p)+(o.dir==='inv'?' · saiu de ':' · entrou em ')+(c?c.nome:o.conta),v:o.total});
  });
  ms.forEach(m=>{
    const fut=m.pend?' · lançamento futuro (não somado)':'';
    if(m.tipo==='in')ev.push({d:m.data,o:1,a:'Ganho · '+m.desc+fut,v:m.valor,c:'pos'});
    else if(m.auto)ev.push({d:m.data,o:1,a:'Perda · '+m.desc,v:m.valor,c:'neg'});
    else ev.push({d:m.data,o:1,a:'Tarifa · '+m.desc+fut,v:m.valor,c:'neg'});
  });
  ev.sort((a,b)=>a.d.localeCompare(b.d)||a.o-b.o);
  const rows=ev.map(x=>({a:fdate(x.d)+' · '+x.a,v:x.v,c:x.c}));
  return{titulo:'Ações · '+mlabel(mes),nome:'acoes',
    obs:'Ganhos e perdas vêm do registro automático das vendas de ações. Tarifas são as saídas lançadas por você na categoria Ações. Compras e vendas aparecem na lista só para acompanhar a ordem dos fatos e não entram nos totais.',
    charts:[{kind:'pie',h:'Ganhos, perdas e tarifas em ações',data:[{l:'Ganhos',v:G},{l:'Perdas',v:P},{l:'Tarifas',v:T}],nota:'Todos os valores do gráfico são mostrados em módulo.'}],
    secs:[
    {h:'Resumo do mês',rows:[
      {a:'Ganhos',v:G,c:'pos'},
      {a:'Perdas',v:P,c:'neg'},
      {a:'Ganho/perda das vendas (antes das tarifas)',v:r2(G-P),c:G-P>=0?'pos':'neg'},
      {a:'Tarifas',v:T,c:'neg'},
      {a:'Resultado líquido do mês',v:liq,c:liq>=0?'pos':'neg',total:1}]},
    {h:'Movimentações em ordem cronológica',rows:rows.length?rows:[{a:'Nenhuma movimentação com ações neste mês.'}]}]};
}
function relCont(mes){
  const ym=d=>d.slice(0,7)===mes,sn=snapDe(mes);
  const nomeC=id=>{const c=find('contas',id);return c?c.nome:'(conta removida)'};
  const grupo=(nome,kind,id,saldo)=>{
    const L2=[];
    S.movs.forEach(m=>{
      if(m.sem||m.pend||m.meio==='cartao'||m.meio==='rend'||!ym(m.data))return;
      if(kind==='c'?(m.meio==='conta'&&m.ref===id):m.meio==='dinheiro'){
        const pg=!!m.pgs;
        L2.push({d:m.data,a:(pg?'Pagamento':m.tipo==='in'?'Entrada':'Saída')+' · '+m.desc+(m.cat?' ('+m.cat+')':'')+(m.autoDeb?' · débito automático':''),v:m.tipo==='in'?m.valor:-m.valor});
      }
    });
    S.transf.forEach(t=>{
      if(!ym(t.data))return;
      if(kind==='c'){
        if(t.de===id)L2.push({d:t.data,a:t.tipo==='sq'?'Saque (para dinheiro em espécie)':'Transferência para '+nomeC(t.para),v:-t.valor});
        if(t.tipo==='tr'&&t.para===id)L2.push({d:t.data,a:'Transferência de '+nomeC(t.de),v:t.valor});
      }else if(t.tipo==='sq')L2.push({d:t.data,a:'Saque de '+nomeC(t.de),v:t.valor});
    });
    if(kind==='c')S.ops.forEach(o=>{
      if(!ym(o.data))return;const c=opConta(o);
      if(c&&c.id===id)L2.push({d:o.data,a:(o.dir==='inv'?'Aplicação em ':'Resgate de ')+o.inv,v:o.dir==='inv'?-o.total:o.total});
    });
    L2.sort((a,b)=>a.d.localeCompare(b.d));
    return{nome,L:L2,saldo};
  };
  const gs=S.contas.map(c=>grupo(c.nome,'c',c.id,sn?(sn.contas.find(z=>z.id===c.id)||sn.contas.find(z=>!z.id&&z.n===c.nome)||{}).v:undefined))
    .concat([grupo('Dinheiro (em espécie)','d',null,sn?sn.din:undefined)]);
  const rows=gs.map(g=>{
    const net=sumv(g.L.map(x=>x.v));
    const sub=g.L.map(x=>({a:fdate(x.d)+' · '+x.a,v:x.v}));
    if(g.saldo!=null)sub.push({a:'Saldo no fim do mês',v:g.saldo,mut:true});
    if(!sub.length)return{a:g.nome+' · sem movimentações'};
    return{a:g.nome+(g.L.length?'':' · sem movimentações'),v:g.L.length?net:undefined,c:net>=0?'pos':'neg',sub};
  });
  const base=S.movs.filter(m=>!m.sem&&!m.pend&&m.meio!=='cartao'&&m.meio!=='rend'&&ym(m.data));
  const trs=S.transf.filter(t=>ym(t.data)),ops=S.ops.filter(o=>ym(o.data));
  /* gráfico: saldo de cada conta e do dinheiro em espécie (no fim do mês escolhido) */
  const dataPie=sn?sn.contas.map(c=>({l:c.n,v:c.v})).concat([{l:'Dinheiro (em espécie)',v:sn.din}]):[];
  return{titulo:'Contas bancárias · '+mlabel(mes),nome:'contas',obs:obsSnap(mes,sn),
    charts:[{kind:'pie',h:mes===cur()?'Saldo atual das contas e do dinheiro em espécie':'Saldo das contas e do dinheiro em espécie no fim de '+mlabel(mes),data:dataPie,nota:sn?notaNeg(dataPie):SEM_SNAP}],
    secs:[
    {h:'Resumo das movimentações',rows:[
      {a:'Entradas recebidas',v:sumv(base.filter(m=>m.tipo==='in').map(m=>m.valor)),c:'pos'},
      {a:'Saídas',v:sumv(base.filter(m=>m.tipo==='out'&&!m.pgs).map(m=>m.valor)),c:'neg'},
      {a:'Pagamentos de dívidas',v:sumv(base.filter(m=>m.tipo==='out'&&m.pgs).map(m=>m.valor)),c:'neg'},
      {a:'Transferências entre contas',v:sumv(trs.filter(t=>t.tipo==='tr').map(t=>t.valor))},
      {a:'Saques (conta → dinheiro)',v:sumv(trs.filter(t=>t.tipo==='sq').map(t=>t.valor))},
      {a:'Aplicados em investimentos',v:sumv(ops.filter(o=>o.dir==='inv').map(o=>o.total))},
      {a:'Resgatados de investimentos',v:sumv(ops.filter(o=>o.dir==='res').map(o=>o.total))}]},
    {h:'Movimentação por conta',rows:rows.length?rows:[{a:'Nenhuma conta cadastrada.'}]}]};
}
/* ganho/perda de uma venda de ações: vem do registro em Entradas/Saídas (se foi editado, vale o valor atual) */
function ganhoOp(o){
  if(o.movId){const m=find('movs',o.movId);return m?(m.tipo==='in'?m.valor:-m.valor):0}
  return o.ganho||0;
}
function invRows(sn){
  return grupoTipos(sn.inv,x=>x.t).map(g=>({a:g.t,v:sumv(g.l.map(i=>i.v)),
    sub:g.l.map(i=>({a:i.n+(i.t==='Ações'?' · '+i.q+' un.':''),v:i.v}))}))
    .concat([{a:'Total em reservas/investimentos',v:sumv(sn.inv.map(i=>i.v)),total:1}]);
}
function relInv(mes){
  const sn=snapDe(mes),secs=[];
  secs.push({h:'Posição no fim do mês',rows:sn?(sn.inv.length?invRows(sn):[{a:'Nenhum investimento registrado.'}]):[{a:SEM_SNAP}]});
  const ops=S.ops.filter(o=>o.data.slice(0,7)===mes).sort((a,b)=>a.data.localeCompare(b.data));
  const ap=ops.filter(o=>o.dir==='inv'),rs=ops.filter(o=>o.dir==='res'),rd=S.movs.filter(m=>m.rend&&!m.pend&&m.data.slice(0,7)===mes);
  const op=o=>{const i=opInvest(o),c=opConta(o),gn=ganhoOp(o);return{a:fdate(o.data)+' · '+(i?i.nome:o.inv)+' · '+(o.dir==='inv'?'de ':'para ')+(c?c.nome:o.conta)+(o.q?' · '+o.q+' un.':'')+(gn?' · '+(gn>0?'ganho':'perda'):''),v:o.total}};
  const mv=[{a:'Aplicações',v:sumv(ap.map(o=>o.total)),sub:ap.map(op)},
    {a:'Resgates',v:sumv(rs.map(o=>o.total)),sub:rs.map(op)},
    {a:'Entradas em investimentos (rendimentos etc.)',v:sumv(rd.map(m=>m.valor)),sub:rd.map(m=>({a:fdate(m.data)+' · '+m.desc+' · '+viaMov(m),v:m.valor}))}].filter(x=>x.sub.length);
  if(rs.some(o=>o.q)){const g=sumv(rs.map(ganhoOp));mv.push({a:'Ganho/perda realizado em ações',v:g,c:g>=0?'pos':'neg',total:1})}
  secs.push({h:'Movimentações no mês',rows:mv.length?mv:[{a:'Nenhuma movimentação neste mês.'}]});
  /* gráfico: investimentos por tipo (posição no fim do mês escolhido) */
  const dataPie=sn?grupoTipos(sn.inv,x=>x.t).map(g=>({l:g.t,v:sumv(g.l.map(i=>i.v))})):[];
  return{titulo:'Investimentos · '+mlabel(mes),nome:'investimentos',obs:obsSnap(mes,sn),
    charts:[{kind:'pie',h:'Investimentos por tipo'+(mes===cur()?'':' (fim de '+mlabel(mes)+')'),data:dataPie,nota:sn?notaNeg(dataPie):SEM_SNAP}],secs};
}
function relPat(mes){
  const sn=snapDe(mes),titulo='Patrimônio · '+mlabel(mes);
  const serie=serieMeses(mes,12);
  const barra={kind:'bar',h:'Patrimônio ao longo dos meses',data:serie,
    nota:'Até '+mlabel(mes)+', no máximo 12 meses. A barra verde é o mês escolhido. Meses sem registro de saldos não aparecem.'};
  if(!sn)return{titulo,nome:'patrimonio',obs:'',
    charts:[{kind:'pie',h:'Composição do patrimônio',data:[],nota:SEM_SNAP},barra],
    secs:[{h:'Patrimônio',rows:[{a:SEM_SNAP}]}]};
  const tc=sumv(sn.contas.map(c=>c.v)),ti=sumv(sn.inv.map(i=>i.v)),td=r2(sn.din);
  const dataPie=[{l:'Contas bancárias',v:tc},{l:'Dinheiro (em espécie)',v:td},{l:'Reservas/Investimentos',v:ti}];
  return{titulo,nome:'patrimonio',obs:obsSnap(mes,sn),
    charts:[{kind:'pie',h:'Composição do patrimônio total',data:dataPie,nota:notaNeg(dataPie)},barra],
    secs:[
    {h:'Contas bancárias',rows:sn.contas.length?sn.contas.map(c=>({a:c.n,v:c.v})).concat([{a:'Total em contas',v:tc,total:1}]):[{a:'Nenhuma conta registrada.'}]},
    {h:'Reservas/Investimentos',rows:sn.inv.length?invRows(sn):[{a:'Nenhum investimento registrado.'}]},
    {h:'Dinheiro (em espécie)',rows:[{a:'Dinheiro em espécie',v:td}]},
    {h:'Patrimônio total',rows:[{a:'Contas bancárias',v:tc},{a:'Reservas/Investimentos',v:ti},{a:'Dinheiro (em espécie)',v:td},{a:'Patrimônio total',v:r2(tc+ti+td),total:1}]}]};
}
const rel=(tipo,mes)=>({res:relRes,ent:m=>relLista(m,'in'),sai:m=>relLista(m,'out'),div:relDiv,con:relCont,inv:relInv,aco:relAcoes,pat:relPat}[tipo]||relRes)(mes);

const mny=(v,h)=>typeof v==='number'?(h&&S.hide?'R$ ••••':fmt(v)):'';
function rowTela(x){
  const val=x.v!=null?`<b class="${x.c||''}">${mny(x.v,1)}</b>`:'';
  const nota=x.notes&&x.notes.length?'<br><small>'+x.notes.map(n=>esc(n.t).replace('{v}',mny(n.v,1))).join(' · ')+'</small>':'';
  if(x.sub){
    return `<details class="grp"><summary><span>${esc(x.a)}${nota}</span>${val}</summary>`+
      x.sub.map(s=>`<div class="row it" style="${s.mut?'opacity:.6;font-style:italic':''}"><small style="color:var(--tx)">${esc(s.a)}</small><span style="white-space:nowrap">${mny(s.v,1)}</span></div>`).join('')+'</details>';
  }
  return `<div class="row${x.total?' it':''}" style="padding:4px 0"><span style="${x.total?'font-weight:700':''}">${esc(x.a)}${nota}</span>${val}</div>`;
}
function relTela(r){
  return (r.obs?`<p class="sub">${esc(r.obs)}</p>`:'')+chartsTela(r)+r.secs.map(s=>`<div class="card"><b>${esc(s.h)}</b><div style="margin-top:6px">${s.rows.map(rowTela).join('')}</div></div>`).join('');
}
function relHTML(r){
  const tr=(a,v,cls)=>`<tr${cls?` class="${cls}"`:''}><td>${esc(a)}</td><td class="n">${mny(v,0)}</td></tr>`;
  const ntx=x=>x.notes&&x.notes.length?' ('+x.notes.map(n=>n.t.replace('{v}',fmt(n.v))).join(' · ')+')':'';
  const rows=s=>s.rows.map(x=>{
    let h=tr(x.a+ntx(x),x.v,x.total?'t':x.sub?'g':'');
    if(x.sub)h+=x.sub.map(t=>tr(t.a,t.v,'s'+(t.mut?' m':''))).join('');
    return h}).join('');
  const chs=(r.charts||[]).map(c=>`<h2>${esc(c.h)}</h2><div class="gr">${chartHTML(c,CT_EXP)}</div>${c.nota?`<p class="o">${esc(c.nota)}</p>`:''}`).join('');
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(r.titulo)}</title>
<style>body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:20px auto;padding:0 14px;color:#16302b}h1{font-size:22px;margin-bottom:2px}h2{font-size:16px;margin:22px 0 6px;color:#0f766e}.o{color:#64748b;font-size:12px;margin:4px 0 0}.gr{max-width:420px}table{width:100%;border-collapse:collapse}td{padding:5px 6px;border-bottom:1px solid #e2e8e6;font-size:14px;vertical-align:top}td.n{text-align:right;white-space:nowrap}tr.g td{font-weight:700}tr.t td{font-weight:700;border-top:2px solid #16302b}tr.s td{font-size:12px;color:#475569;padding-left:22px}tr.m td{font-style:italic;opacity:.7}</style></head><body>
<h1>${esc(r.titulo)}</h1><p class="o">Minha Vida Financeira · gerado em ${fdate(today())}${r.obs?' · '+esc(r.obs):''}</p>
${chs}
${r.secs.map(s=>`<h2>${esc(s.h)}</h2><table>${rows(s)}</table>`).join('')}</body></html>`;
}
async function entregaArquivo(nome,txt,mime){
  const file=new File([txt],nome,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=nome;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function exportaRel(){
  const r=rel(tabH,mesH);
  entregaArquivo('relatorio-'+r.nome+'-'+mesH+'.html',relHTML(r),'text/html');
}

/* ---------- BACKUP ---------- */
function exportar(){entregaArquivo(nomeBackup(),JSON.stringify(S),'application/json')}
/* importar: o nome vem só do arquivo. Backup sem nome => a tela inicial volta a pedir o nome */
function importar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.contas)||!Array.isArray(d.dividas)||!Array.isArray(d.movs))throw 0;
      if(!confirm('Substituir TODOS os dados atuais pelos do backup?')){inp.value='';return}
      const t=S.tema;S=Object.assign(DEF(),d);S.flags=d.flags||{};S.tema=d.tema||t;
      S.nome=typeof d.nome==='string'?d.nome:'';
      save();location.reload();
    }catch(e){alert('Arquivo inválido. Use um backup exportado pelo próprio app.');inp.value=''}
  };
  r.readAsText(f);
}

/* ---------- BLOQUEIO (senha / padrão / biometria do aparelho) ---------- */
const LKEY='vfLock';
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let L=Object.assign({on:false,id:null,min:1},JSON.parse(localStorage.getItem(LKEY)||'null')||{});
const saveL=()=>localStorage.setItem(LKEY,JSON.stringify(L));
let locked=L.on,authBusy=false,hiddenAt=0;
const liberaBusy=()=>setTimeout(()=>{authBusy=false},600);

async function lockDisponivel(){
  if(!window.isSecureContext||!window.PublicKeyCredential||!navigator.credentials)return false;
  try{return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch(e){return false}
}
function showLock(){
  $('lock').style.display=locked?'flex':'none';
  $('app').style.display=locked?'none':'';
  $('modal').style.display=locked?'none':'';
}
async function pedeAuth(){
  authBusy=true;
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:'public-key',id:unb64(L.id),transports:['internal']}],
      userVerification:'required',timeout:60000}});
    return true;
  }catch(e){return false}
  finally{liberaBusy()}
}
async function desbloquear(){
  if(authBusy||!L.on)return;
  $('lockmsg').textContent='';
  if(await pedeAuth()){locked=false;showLock()}
  else $('lockmsg').textContent='Não foi possível desbloquear. Toque em Desbloquear para tentar de novo.';
}
async function ativaBloqueio(){
  if(!(await lockDisponivel()))
    return alert('Este aparelho ou navegador não permite o bloqueio aqui. Confira se o app está aberto pelo link https e se o celular tem senha, padrão ou biometria configurada.');
  authBusy=true;
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Minha Vida Financeira'},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'usuario',displayName:'Usuário'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000}});
    L.on=true;L.id=b64(cred.rawId);saveL();render();
  }catch(e){alert('O bloqueio não foi ativado (confirmação cancelada ou não suportada).')}
  finally{liberaBusy()}
}
async function desativaBloqueio(){
  if(!(await pedeAuth()))return alert('Confirmação não concluída. O bloqueio continua ativado.');
  L.on=false;L.id=null;saveL();render();
}
function setMin(v){L.min=Number(v);saveL()}
function bloquearAgora(){locked=true;showLock()}
function esqueci(){
  if(!confirm('Se você não consegue desbloquear, a única saída é APAGAR todos os dados deste app neste aparelho. Continuar?'))return;
  if(!confirm('Tem certeza? Só dá para recuperar se você tiver um backup.'))return;
  localStorage.removeItem(KEY);localStorage.removeItem(LKEY);location.reload();
}
document.addEventListener('visibilitychange',()=>{
  if(authBusy||!L.on)return;
  if(document.hidden){
    if(locked)return;
    if(L.min===0){locked=true;showLock()}else hiddenAt=Date.now();
  }else{
    if(!locked&&hiddenAt&&Date.now()-hiddenAt>=L.min*60000){locked=true;showLock()}
    hiddenAt=0;
    if(locked)desbloquear();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)atualizaAuto()});

/* ---------- render ---------- */
const dataHoje=()=>{const s=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)};
function render(){
  if(route!=='editmov')editMode='';
  $('app').innerHTML=screens[route]();
  if(route==='entradas'||route==='saidas'){
    updForm();
    if(route==='entradas'&&preset){$('cat').value='__rend';updForm();if($('refi'))$('refi').value=preset;preset=null}
  }
  if(route==='editmov')prefillEdit();
  if(route==='cartao')hintFat(cartaoAtual);
  if($('dt'))$('dt').textContent=dataHoje();
}
setInterval(()=>{if($('dt'))$('dt').textContent=dataHoje();atualizaAuto()},60000);
processaRec();
processaAuto();
save();
applyTema();render();showLock();
if(locked)desbloquear();

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
