<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Tempo">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Meu Tempo</title>
<style>
:root{color-scheme:dark;--sel:#1d2a3a;--hov:#373746;--faint:#555;--tint:rgba(255,255,255,.06);--tint2:rgba(255,255,255,.03);--bg:#121214;--card:#1a1a20;--border:#2a2a36;--bl:#343442;--text:#e1e1e6;--muted:#8d8d99;--primary:#00875f;--ph:#00b37e;--danger:#e53e3e;--dw:56px;--rh:48px}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{padding:.7rem 1.1rem;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.tg{display:flex;align-items:baseline;gap:.7rem}.tg h1{font-size:1.15rem}.tg span{font-size:.85rem;color:var(--muted)}
.nav{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
button{background:var(--border);color:var(--text);border:1px solid var(--bl);padding:.4rem .8rem;border-radius:6px;cursor:pointer;font-size:.85rem}
button:hover{background:#373746}button.on{border-color:var(--ph);color:var(--ph)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}button.primary:hover{background:var(--ph)}
button.danger{color:var(--danger)}
main{flex:1;display:flex;min-height:0}
.cal{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:var(--dw) repeat(7,minmax(0,1fr));min-width:700px}
.corner,.dl,.tl{background:var(--card);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.corner{position:sticky;top:0;left:0;z-index:7}
.dl{position:sticky;top:0;z-index:5;padding:.5rem .3rem;text-align:center;cursor:pointer}
.dl.sel{background:#1d2a3a}
.dn{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
.dd{font-size:1.05rem;font-weight:600;margin-top:2px}.dd.today{color:var(--ph);text-decoration:underline}
.tot{font-size:.7rem;color:var(--muted);min-height:.9rem}
.tl{position:sticky;left:0;z-index:6;height:var(--rh);padding:.35rem .5rem;font-size:.72rem;color:var(--muted);text-align:right;user-select:none}
.slot{position:relative;height:var(--rh);border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer}
.slot.td{background:rgba(0,135,95,.08)}
.slot:hover{background:rgba(255,255,255,.03)}
.cell{position:absolute;overflow:hidden}
.fill{position:absolute;left:0;right:0}
.lbl{position:absolute;top:4px;left:6px;font-size:.74rem;font-weight:600;text-shadow:0 1px 2px #000;z-index:3;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside{width:290px;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:.9rem;display:none;flex-direction:column;gap:1rem}
aside.open{display:flex}
aside h4{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
.mh{display:flex;align-items:center;justify-content:space-between;gap:.2rem;margin-bottom:.4rem}
.mh button{padding:.25rem .5rem}.mh b{font-size:.85rem;text-transform:capitalize}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:.75rem}
.mg .w{color:var(--muted);font-size:.65rem}
.md{padding:.4rem 0;border-radius:5px;cursor:pointer;position:relative}
.md:hover{background:var(--border)}.md.out{color:#555}.md.inw{background:rgba(255,255,255,.06)}
.md.td{color:var(--ph);font-weight:700}.md.sel{outline:1px solid #4299e1}
.md.has::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ph)}
textarea,input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.5rem;border-radius:5px;font-size:.85rem;outline:none}
textarea:focus,input:focus{border-color:var(--primary)}
input.cp{width:40px;height:30px;padding:0;cursor:pointer;background:none}
.sum input.cp{width:18px;height:18px;border:none;border-radius:50%;margin-right:.5rem}
#notes{min-height:220px;resize:vertical}
.sum{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;padding:.2rem 0;gap:.5rem}
.sum span{display:flex;align-items:center}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;justify-content:center;align-items:center}
.ov.open{display:flex}
.mc{background:var(--card);border:1px solid var(--bl);border-radius:8px;width:92%;max-width:400px;padding:1.2rem;max-height:96vh;overflow-y:auto}
.mc h3{font-size:1.05rem;margin-bottom:.8rem}
.f{margin-bottom:.7rem}.f label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.25rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.act{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
@media(max-width:800px){
  :root{--dw:40px;--rh:46px}
  .grid{min-width:0}
  header{padding:.6rem .8rem;display:block}
  .tg{flex-wrap:wrap;gap:.1rem .7rem;margin-bottom:.6rem}.tg h1{font-size:1.45rem}.tg span{font-size:1.05rem}
  .nav{display:grid;grid-template-columns:repeat(12,1fr);gap:.45rem}
  .nav button{padding:.7rem .2rem;font-size:1rem;min-height:46px;grid-column:span 3}
  .nav .w4{grid-column:span 4}
  .cal{overflow-x:hidden;touch-action:pan-y}
  input,textarea{font-size:16px}
  .dl{padding:.35rem .1rem}.dn{font-size:.62rem}.dd{font-size:.95rem}.tot{font-size:.6rem}
  .tl{padding:.3rem .2rem;font-size:.6rem}
  .lbl{font-size:.62rem;line-height:1.1;white-space:normal;word-break:break-word;left:4px;top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  aside{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:60vh;border-left:none;border-top:1px solid var(--border);z-index:50}
}
[data-theme=light]{color-scheme:light;--bg:#f2f3f6;--card:#fff;--border:#e0e2ea;--bl:#cdd1dc;--text:#1d1d24;--muted:#6a6e80;--sel:#dcebfb;--hov:#e6e8ef;--faint:#b5b8c4;--tint:rgba(0,0,0,.05);--tint2:rgba(0,0,0,.03);--primary:#00875f;--ph:#00774f}
.dl.sel{background:var(--sel)}button:hover{background:var(--hov)}.md.out{color:var(--faint)}.md.inw{background:var(--tint)}.slot:hover{background:var(--tint2)}
.lbl{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.ev{position:relative;z-index:4;margin:0 2px 1px;padding:1px 4px;border:1px dashed #4299e1;border-radius:4px;background:var(--card);color:var(--text);font-size:.62rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.evs{position:absolute;left:0;right:0;bottom:1px;display:flex;flex-direction:column;z-index:4}
.tabs{display:flex;gap:.3rem;margin-bottom:.4rem}.tabs button{flex:1;padding:.3rem}.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.evl{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;padding:.3rem 0;cursor:pointer;border-bottom:1px solid var(--border)}.evl span:last-child{color:var(--muted);white-space:nowrap}
.srow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.4rem}.srow button{flex:1}
.sec{border-top:1px solid var(--border);padding-top:.8rem;margin-top:.8rem}.sec h4{font-size:.8rem;color:var(--muted);text-transform:uppercase;margin-bottom:.4rem}
.chk{display:flex;gap:.5rem;align-items:center;font-size:.8rem;margin:.4rem 0}.chk input{width:auto}
html,body{overflow-x:hidden;max-width:100vw}
</style>
</head>
<body>
<header>
  <div class="tg"><h1>⏳ Meu Tempo</h1><span id="range"></span></div>
  <div class="nav">
    <button onclick="mudar(-1)">‹</button>
    <button onclick="hoje()">Hoje</button>
    <button onclick="mudar(1)">›</button>
    <button onclick="abrirCfg()" title="Configurações" aria-label="Configurações">⚙️</button>
    <button class="w4" id="bCal" onclick="painel('cal')">📅 Calendário</button>
    <button class="w4" id="bNot" onclick="painel('not')">📝 Notas</button>
    <button class="w4" onclick="abrirEv()">➕ Evento</button>
  </div>
</header>
<main>
  <div class="cal" id="calBox"><div class="grid" id="grid"></div></div>
  <aside id="side">
    <section id="pCal" style="display:none">
      <div class="mh"><button onclick="mes(-12)">«</button><button onclick="mes(-1)">‹</button><b id="mTitle"></b><button onclick="mes(1)">›</button><button onclick="mes(12)">»</button></div>
      <div class="mg" id="mg"></div>
      <div class="tabs" style="margin-top:1rem"><button id="tDia" onclick="sumMode='dia';render()">Resumo do dia</button><button id="tSem" onclick="sumMode='sem';render()">Resumo da semana</button></div>
      <div id="sum"></div>
      <h4 style="margin-top:1rem">Eventos da semana</h4>
      <div id="evList"></div>
    </section>
    <section id="pNot" style="display:none">
      <h4 id="nTitle">Anotações</h4>
      <textarea id="notes" placeholder="Anotações do dia..." oninput="salvarNota()"></textarea>
    </section>
  </aside>
</main>

<div class="ov" id="modal"><div class="mc">
  <h3 id="mT">Atividade</h3>
  <div class="f"><label>Data</label><input id="fDate" type="date"></div>
  <div class="f"><label>O que você fez?</label><input id="fDesc" list="acts" placeholder="Ex: Estudo, Trabalho, Treino, Sono..." oninput="if(!cdirty)document.getElementById('fColor').value=colorOf(this.value)" onkeydown="if(event.key==='Enter')salvar()"><datalist id="acts"></datalist></div>
  <div class="two">
    <div class="f"><label>Início</label><input id="fStart" type="time"></div>
    <div class="f"><label>Fim (passou da meia-noite? sem problema)</label><input id="fEnd" type="time"></div>
  </div>
  <div class="f"><label>Cor da atividade (vale para todos os quadrinhos com esse nome)</label><input class="cp" id="fColor" type="color" oninput="cdirty=true"></div>
  <div class="act">
    <button class="danger" id="bDel" onclick="apagar()">Apagar</button>
    <button onclick="fechar()">Cancelar</button>
    <button class="primary" onclick="salvar()">Salvar</button>
  </div>
</div></div>

<div class="ov" id="evModal"><div class="mc">
  <h3 id="evT">Novo evento</h3>
  <div class="two">
    <div class="f"><label>Data</label><input id="eDate" type="date"></div>
    <div class="f"><label>Hora</label><input id="eTime" type="time"></div>
  </div>
  <div class="f"><label>Nome do evento</label><input id="eName" placeholder="Ex: Consulta, Reunião, Treino..." onkeydown="if(event.key==='Enter')salvarEv()"></div>
  <div class="act" style="flex-wrap:wrap">
    <button class="danger" id="eDel" onclick="apagarEv()">Excluir</button>
    <button onclick="fecharEv()">Cancelar</button>
    <button class="primary" onclick="salvarEv()">Salvar</button>
  </div>
  <button class="primary" id="eReg" style="width:100%;margin-top:.6rem" onclick="registrarEv()">✔ Aconteceu: registrar como atividade</button>
</div></div>

<div class="ov" id="cfgModal"><div class="mc">
  <h3>⚙️ Configurações</h3>
  <div class="sec" style="border:0;margin:0;padding:0"><h4>Tema</h4>
    <div class="srow"><button id="thD" onclick="tema('dark')">🌙 Escuro</button><button id="thL" onclick="tema('light')">☀️ Claro</button></div></div>
  <div class="sec"><h4>Dados</h4>
    <div class="srow"><button onclick="exportar()">⬇️ Exportar</button><button onclick="document.getElementById('imp').click()">⬆️ Importar</button></div>
    <label class="chk"><input type="checkbox" id="impMerge" checked> Mesclar com os dados atuais (desmarque para substituir tudo)</label>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importar(this)">
    <div class="srow"><button class="danger" onclick="apagarTudo()">🗑️ Apagar todos os dados</button></div></div>
  <div class="sec" id="instSec" style="display:none"><div class="srow"><button class="primary" onclick="instalar()">📲 Instalar o app</button></div></div>
  <div class="act"><button onclick="fecharCfg()">Fechar</button></div>
</div></div>

<script>
const KEY="tempo_v1", DIAS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
let db={acts:[],slots:{},notes:{},colors:{}};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(db,JSON.parse(r))}catch(e){}
db.slots=db.slots||{};db.notes=db.notes||{};db.colors=db.colors||{};db.events=db.events||[];db.acts=db.acts||[];
let sumMode="dia";
function tema(t,sv=true){document.documentElement.dataset.theme=t;if(sv)try{localStorage.setItem("tempo_tema",t)}catch(e){}
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="light"?"#ffffff":"#1a1a20";
  const a=document.getElementById("thD"),b=document.getElementById("thL");if(a){a.classList.toggle("on",t!=="light");b.classList.toggle("on",t==="light")}}
try{tema(localStorage.getItem("tempo_tema")||"dark",false)}catch(e){}
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}

let monday=getMonday(new Date()), sel=dk(new Date()), calM=new Date(), cur=null, cdirty=false, first=true;
calM.setDate(1);
const open={cal:false,not:false};

function getMonday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function br(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
const sk=(k,h)=>k+"|"+h, norm=t=>t.trim().toLowerCase();
function hue(t){let h=0;for(const c of norm(t))h=(h*31+c.charCodeAt(0))%360;return h}
function hsl2hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,"0")};return "#"+f(0)+f(8)+f(4)}
function colorOf(t){return db.colors[norm(t)]||hsl2hex(hue(t),55,36)}
function fmt(min){const h=Math.floor(min/60),m=Math.round(min%60);return h?h+"h"+(m?String(m).padStart(2,"0"):""):m+"min"}
function dayTotal(k){return db.acts.reduce((n,x)=>x.d===k?n+x.e-x.s:n,0)}
function el(c,t){const e=document.createElement("div");e.className=c;if(t!=null)e.textContent=t;return e}

function mudar(n){monday.setDate(monday.getDate()+7*n);sel=dk(monday);render()}
function hoje(){monday=getMonday(new Date());sel=dk(new Date());calM=new Date();calM.setDate(1);render()}
function mes(n){calM=new Date(calM.getFullYear(),calM.getMonth()+n,1);renderMonth()}
function pickDay(k){sel=k;monday=getMonday(pd(k));render()}
function painel(p){open[p]=!open[p];render()}

function render(){
  const dias=[...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d});
  const keys=dias.map(dk), hk=dk(new Date());
  const A={};keys.forEach(k=>A[k]=db.acts.filter(x=>x.d===k));
  const same=(x,t)=>norm(x.t)===norm(t);
  const g=$("grid");g.innerHTML="";
  g.appendChild(el("corner"));
  dias.forEach((d,i)=>{
    const k=keys[i],dl=el("dl"+(k===sel?" sel":""));
    dl.onclick=()=>{sel=k;render()};
    const t=dayTotal(k);
    dl.appendChild(el("dn",DIAS[i]));dl.appendChild(el("dd"+(k===hk?" today":""),d.getDate()));dl.appendChild(el("tot",t?fmt(t):""));
    g.appendChild(dl);
  });
  for(let h=0;h<24;h++){
    const tl=el("tl",String(h).padStart(2,"0")+":00");tl.dataset.h=h;g.appendChild(tl);
    const H0=h*60,H1=H0+60;
    dias.forEach((d,i)=>{
      const k=keys[i],slot=el("slot"+(k===hk?" td":""));
      slot.onclick=e=>{const r=slot.getBoundingClientRect();clicou(k,h,H0+Math.max(0,Math.min(59,Math.floor((e.clientY-r.top)/r.height*60))))};
      const hs=A[k].filter(x=>x.s<H1&&x.e>H0);
      hs.forEach(x=>{
        const a=Math.max(x.s,H0),b=Math.min(x.e,H1);
        const geo=kk=>A[kk].some(y=>same(y,x.t)&&Math.max(y.s,H0)===a&&Math.min(y.e,H1)===b&&y.s<H1&&y.e>H0);
        const U=a===H0&&(x.s<H0||A[k].some(y=>same(y,x.t)&&y.e===x.s));
        const D=b===H1&&(x.e>H1||A[k].some(y=>same(y,x.t)&&y.s===x.e));
        const L=i>0&&geo(keys[i-1]),R=i<6&&geo(keys[i+1]);
        const c=colorOf(x.t),cell=el("cell"),rad=`${!L&&!U?6:0}px ${!R&&!U?6:0}px ${!R&&!D?6:0}px ${!L&&!D?6:0}px`;
        cell.style.cssText=`top:${U?0:2}px;bottom:${D?-1:2}px;left:${L?0:2}px;right:${R?-1:2}px;border-radius:${rad};`+(hs.length===1?`background:${c}30;`:"");
        cell.title=x.t+" · "+hm(x.s)+"–"+hm(x.e);
        const f=el("fill");f.style.cssText=`top:${(a-H0)/60*100}%;height:${(b-a)/60*100}%;background:${c};box-shadow:0 0 14px ${c}88;border-radius:${rad}`;
        cell.appendChild(f);slot.appendChild(cell);
        if(!U&&!L){
          let run=1;while(i+run<7&&geo(keys[i+run]))run++;
          const l=el("lbl",x.t);l.style.cssText=`top:${(a-H0)/60*100}%;height:${(b-a)/60*100}%;padding-top:2px;width:calc(${run*100}% - 10px)`;
          slot.appendChild(l);
        }
      });
      const evs=db.events.filter(e=>e.date===k&&parseInt(e.time)===h);
      if(evs.length){const w=el("evs");evs.forEach(e=>{const c=el("ev",e.time+" "+e.name);c.title=e.time+" "+e.name;c.onclick=x=>{x.stopPropagation();abrirEv(e)};w.appendChild(c)});slot.appendChild(w)}
      g.appendChild(slot);
    });
  }
  $("range").textContent=br(dias[0])+" a "+br(dias[6])+" de "+dias[6].getFullYear();
  $("side").classList.toggle("open",open.cal||open.not);
  $("pCal").style.display=open.cal?"block":"none";
  $("pNot").style.display=open.not?"block":"none";
  $("bCal").classList.toggle("on",open.cal);
  $("bNot").classList.toggle("on",open.not);
  if(open.cal){renderMonth();renderSum(sumMode==="dia"?[sel]:keys);renderEvList(keys);$("tDia").classList.toggle("on",sumMode==="dia");$("tSem").classList.toggle("on",sumMode!=="dia")}
  if(open.not)renderNotes();
  if(first){first=false;const b=$("calBox"),h6=g.querySelector('.tl[data-h="6"]');
    b.scrollTop+=h6.getBoundingClientRect().top-b.getBoundingClientRect().top-g.querySelector(".corner").offsetHeight}
}

function renderMonth(){
  const y=calM.getFullYear(),m=calM.getMonth();
  document.getElementById("mTitle").textContent=calM.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const g=document.getElementById("mg");g.innerHTML="";
  ["S","T","Q","Q","S","S","D"].forEach(w=>g.appendChild(el("w",w)));
  const start=getMonday(new Date(y,m,1)),hk=dk(new Date()),wk=[...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return dk(d)});
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=dk(d);
    const e=el("md"+(d.getMonth()!==m?" out":"")+(wk.includes(k)?" inw":"")+(k===hk?" td":"")+(k===sel?" sel":"")+(dayTotal(k)?" has":""),d.getDate());
    e.onclick=()=>pickDay(k);g.appendChild(e);
  }
}

function renderSum(keys){
  const tot={};
  keys.forEach(k=>db.acts.forEach(x=>{if(x.d===k){const n=norm(x.t);(tot[n]=tot[n]||{t:x.t,m:0}).m+=x.e-x.s}}));
  const box=document.getElementById("sum");box.innerHTML="";
  if(keys.length===1){const t=el("sum",pd(keys[0]).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}));t.style.color="var(--muted)";box.appendChild(t)}
  const arr=Object.values(tot).sort((a,b)=>b.m-a.m);
  if(!arr.length){box.appendChild(el("sum","Nada registrado."));return}
  arr.forEach(a=>{
    const r=el("sum"),l=document.createElement("span"),i=document.createElement("input");
    i.type="color";i.className="cp";i.value=colorOf(a.t);
    i.onchange=()=>{db.colors[norm(a.t)]=i.value;persist();render()};
    l.appendChild(i);l.appendChild(document.createTextNode(a.t));
    const v=document.createElement("b");v.textContent=fmt(a.m);r.appendChild(l);r.appendChild(v);box.appendChild(r);
  });
  const tt=el("sum");tt.style.cssText="border-top:1px solid var(--border);margin-top:.3rem;padding-top:.4rem";
  tt.appendChild(el("","Total registrado"));tt.appendChild(Object.assign(document.createElement("b"),{textContent:fmt(arr.reduce((x,a)=>x+a.m,0))}));box.appendChild(tt);
}

function renderNotes(){
  document.getElementById("nTitle").textContent="Anotações · "+pd(sel).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const t=document.getElementById("notes");if(document.activeElement!==t)t.value=db.notes[sel]||"";
}
function salvarNota(){
  const v=document.getElementById("notes").value;
  if(v.trim())db.notes[sel]=v;else delete db.notes[sel];persist();
}

const hm=m=>m>=1440?"00:00":String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const tmin=v=>{const [h,m]=v.split(":").map(Number);return h*60+m};
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
function addDays(k,n){const d=pd(k);d.setDate(d.getDate()+n);return dk(d)}
function junta(d){
  const dia=db.acts.filter(x=>x.d===d).sort((a,b)=>a.s-b.s),out=[];
  dia.forEach(x=>{const p=out[out.length-1];if(p&&p.e===x.s&&norm(p.t)===norm(x.t))p.e=x.e;else out.push({...x})});
  db.acts=db.acts.filter(x=>x.d!==d).concat(out);
}
function place(d,s,e,t){
  const out=[];
  db.acts.forEach(x=>{
    if(x.d!==d||x.e<=s||x.s>=e){out.push(x);return}
    if(x.s<s)out.push({...x,e:s});
    if(x.e>e)out.push({...x,s:e,id:x.s<s?uid():x.id});
  });
  out.push({id:uid(),d,s,e,t});db.acts=out;junta(d);
}
function converter(slots){
  const l=[];
  for(const key in slots){const [d,h]=key.split("|"),x=slots[key],s=+h*60;l.push({d,s,e:s+Math.min(60,x.m),t:x.t})}
  l.sort((a,b)=>a.d.localeCompare(b.d)||a.s-b.s);
  const out=[];l.forEach(x=>{const p=out[out.length-1];if(p&&p.d===x.d&&norm(p.t)===norm(x.t)&&p.e===x.s)p.e=x.e;else out.push({...x})});
  return out.map(x=>({...x,id:uid()}));
}
function migrar(){
  if(db.slots&&Object.keys(db.slots).length){db.acts=db.acts.concat(converter(db.slots));persist()}
  delete db.slots;
}
function clicou(k,h,mi){
  const dia=db.acts.filter(x=>x.d===k),a=dia.find(x=>x.s<=mi&&mi<x.e);
  if(a){abrir(k,h,{act:a});return}
  const s=Math.floor(mi/5)*5;let lim=(h+1)*60;
  dia.forEach(x=>{if(x.s>s&&x.s<lim)lim=x.s});
  abrir(k,h,{s,e:lim});
}
function abrir(k,h,o={}){
  const a=o.act,ev=o.ev;
  cur={k,act:a?a.id:null,ev:ev?ev.id:null};cdirty=false;
  const s=a?a.s:(o.s??(ev?tmin(ev.time):h*60)),e=a?a.e:(o.e??Math.min(1440,(ev?s:h*60)+60));
  $("mT").textContent=ev?"Registrar evento como atividade":(a?"Editar atividade":"Nova atividade");
  $("fDate").value=a?a.d:k;$("fStart").value=hm(s);$("fEnd").value=hm(e);
  $("fDesc").value=ev?ev.name:(a?a.t:"");
  $("fColor").value=colorOf($("fDesc").value);
  $("bDel").style.display=a?"":"none";
  const dl=$("acts");dl.innerHTML="";
  [...new Set(db.acts.map(x=>x.t))].forEach(n=>{const o=document.createElement("option");o.value=n;dl.appendChild(o)});
  $("modal").classList.add("open");
  setTimeout(()=>$("fDesc").focus(),50);
}
function fechar(){$("modal").classList.remove("open");cur=null}
function salvar(){
  const t=$("fDesc").value.trim(),d=$("fDate").value;if(!t||!d||!$("fStart").value||!$("fEnd").value||!cur)return;
  const s=tmin($("fStart").value);let e=tmin($("fEnd").value);if(e===0)e=1440;
  if(e===s){alert("O início e o fim não podem ser iguais.");return}
  if(cdirty)db.colors[norm(t)]=$("fColor").value;
  if(cur.act)db.acts=db.acts.filter(x=>x.id!==cur.act);
  if(e>s)place(d,s,e,t);else{place(d,s,1440,t);place(addDays(d,1),0,e,t)}
  if(cur.ev)db.events=db.events.filter(x=>x.id!==cur.ev);
  persist();fechar();render();
}
function apagar(){if(!cur||!cur.act)return;db.acts=db.acts.filter(x=>x.id!==cur.act);persist();fechar();render()}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")fechar()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){fechar();fecharEv();fecharCfg()}});
["evModal","cfgModal"].forEach(i=>$(i).addEventListener("click",e=>{if(e.target.id===i)e.target.classList.remove("open")}));

// ---- Eventos
let evCur=null;
function abrirEv(ev){
  evCur=ev?ev.id:null;
  $("evT").textContent=ev?"Evento":"Novo evento";
  $("eDate").value=ev?ev.date:sel;
  $("eTime").value=ev?ev.time:String(new Date().getHours()).padStart(2,"0")+":00";
  $("eName").value=ev?ev.name:"";
  $("eDel").style.display=$("eReg").style.display=ev?"":"none";
  $("evModal").classList.add("open");
  if(!ev)setTimeout(()=>$("eName").focus(),50);
}
function fecharEv(){$("evModal").classList.remove("open");evCur=null}
function salvarEv(){
  const name=$("eName").value.trim(),date=$("eDate").value,time=$("eTime").value;
  if(!name||!date||!time)return;
  const ev=evCur&&db.events.find(e=>e.id===evCur);
  if(ev){ev.name=name;ev.date=date;ev.time=time}
  else db.events.push({id:"ev"+Date.now()+Math.random().toString(36).slice(2,5),date,time,name});
  persist();fecharEv();pickDay(date);
}
function apagarEv(){db.events=db.events.filter(e=>e.id!==evCur);persist();fecharEv();render()}
function registrarEv(){
  const ev=db.events.find(e=>e.id===evCur);if(!ev)return;
  fecharEv();abrir(ev.date,parseInt(ev.time),{ev});
}
function renderEvList(keys){
  const box=$("evList");box.innerHTML="";
  const l=db.events.filter(e=>keys.includes(e.date)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!l.length){const e=el("sum","Nenhum evento.");e.style.color="var(--muted)";box.appendChild(e);return}
  l.forEach(e=>{const r=el("evl");r.appendChild(el("",e.name));r.appendChild(Object.assign(document.createElement("span"),{textContent:br(pd(e.date))+" "+e.time}));r.onclick=()=>abrirEv(e);box.appendChild(r)});
}

// ---- Configurações
let dp=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
addEventListener("appinstalled",()=>{dp=null});
function instalar(){if(dp){dp.prompt();dp=null;$("instSec").style.display="none"}}
function abrirCfg(){tema(document.documentElement.dataset.theme||"dark",false);$("instSec").style.display=dp?"block":"none";$("cfgModal").classList.add("open")}
function fecharCfg(){$("cfgModal").classList.remove("open")}
function exportar(){
  const blob=new Blob([JSON.stringify({app:"meu-tempo",versao:2,exportadoEm:new Date().toISOString(),dados:db})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="meu-tempo-"+dk(new Date())+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function importar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),d=j.dados||j;
      if(!d||(typeof d.slots!=="object"&&!Array.isArray(d.acts)))throw 0;
      const ia=(d.acts||[]).concat(converter(d.slots||{}));
      if($("impMerge").checked){
        ia.forEach(x=>place(x.d,x.s,x.e,x.t));Object.assign(db.notes,d.notes||{});Object.assign(db.colors,d.colors||{});
        const ids=new Set(db.events.map(e=>e.id));(d.events||[]).forEach(e=>{if(!ids.has(e.id))db.events.push(e)});
      }else{
        if(!confirm("Substituir TODOS os dados atuais pelos do arquivo?"))return;
        db={acts:ia.map(x=>({...x,id:x.id||uid()})),notes:d.notes||{},colors:d.colors||{},events:d.events||[]};
      }
      persist();render();alert("Dados importados!");
    }catch(e){alert("Arquivo inválido. Use um arquivo exportado por este app.")}
    inp.value="";
  };
  r.readAsText(f);
}
function apagarTudo(){
  if(!confirm("Apagar TODOS os dados (atividades, notas, eventos e cores)? Isso não pode ser desfeito. Exporte antes se quiser uma cópia."))return;
  db={acts:[],notes:{},colors:{},events:[]};persist();render();fecharCfg();
}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

migrar();render();
</script>
