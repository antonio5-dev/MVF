<!DOCTYPE html>
<html lang="pt-BR" data-theme="padrao">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000" id="tc">
<meta name="description" content="Minha Vida Financeira: controle de patrimônio, contas, cartões e dívidas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minha Vida">
<title>Minha Vida Financeira</title>
<style>
:root{--bg:#0e1514;--card:#17221f;--tx:#e8f2ef;--mut:#8ea6a1;--bd:#2b3b37;--pri:#0f9488;--hd:#0b2f2b;--inp:#0f1917;--pos:#4ade80;--neg:#f87171;--warn:#fbbf24;color-scheme:dark}
[data-theme=light]{--bg:#f1f5f4;--card:#fff;--tx:#16302b;--mut:#64748b;--bd:#cbd5d1;--pri:#0f766e;--hd:#0f766e;--inp:#fff;--pos:#15803d;--neg:#b91c1c;--warn:#b45309;color-scheme:light}
[data-theme=padrao]{--bg:#000;--card:#131313;--tx:#f2f2f2;--mut:#8f8f8f;--bd:#262626;--pri:#3a3a3a;--hd:#000;--inp:#0b0b0b;--pos:#8fd6a4;--neg:#e88f8f;--warn:#e3c37a;color-scheme:dark;--fn:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#app{max-width:480px;margin:auto}
header{background:var(--hd);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;line-height:1.2;flex:1;min-width:0}
header button{background:none;border:0;color:#fff;font-size:26px;padding:0 6px}
header button.hb{width:30px;height:30px;border:2px solid #fff;border-radius:50%;font-size:16px;font-weight:700;padding:0;line-height:1;flex:none}
header button.hi{flex:none;padding:4px;line-height:0;display:flex;align-items:center;justify-content:center}
header button.hi svg{width:24px;height:24px}
.pad{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.total{background:var(--pri);color:#fff;border-color:transparent}
.total .v{font-size:30px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px;font-size:16px;color:var(--tx);text-align:left}
.pos{color:var(--pos)}.neg{color:var(--neg)}
small,.sub{color:var(--mut);font-size:12px}
.total small{color:#d5f3ee}
.big{font-size:20px;font-weight:700}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--inp);color:var(--tx)}
input[type=checkbox]{width:auto;margin:0;padding:0;transform:scale(1.35);flex:none}
.chk{display:flex;align-items:center;gap:12px;margin:12px 0 6px;font-size:14px}
input:disabled,select:disabled{opacity:.5}
.add{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:13px;width:100%;font-size:16px;margin-top:6px}
.danger{background:#b91c1c}
.cancel{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.ic{background:none;border:0;font-size:18px;padding:4px 8px;color:var(--tx)}
.mini{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;margin:2px 0}
.mini.alt{background:transparent;border:1px solid var(--pri);color:var(--tx)}
.nav{padding:8px 16px;font-size:18px;margin:0}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);margin-left:4px;font-weight:400}
.tag.neg{border-color:var(--neg);font-weight:700}
.it{padding-top:8px;margin-top:8px;border-top:1px solid var(--bd)}
h3{margin:14px 0 8px}
.gh{margin:16px 2px 8px;font-size:16px}
.eye{background:#ffffff33;border:0;color:#fff;border-radius:20px;padding:6px 12px;font-size:14px}
.warn{color:var(--warn);font-size:13px}
.muted{opacity:.65}
.nm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 12px}
.nm span{font-size:22px;font-weight:600;overflow-wrap:anywhere}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:0 0 18px 18px;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;max-height:85vh;overflow:auto}
#lock{display:none;position:fixed;inset:0;z-index:50;background:#000;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#lock .wm{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif",serif;font-weight:300;font-size:30px;line-height:1.4;letter-spacing:.14em;color:#fff;margin:0 0 44px}
#lock button.ub{background:none;border:1px solid #ffffff55;color:#fff;border-radius:999px;padding:11px 28px;font-size:14px;letter-spacing:.08em}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
details.grp{border-top:1px solid var(--bd);padding:8px 0}
details.grp:first-child{border-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{flex:1 1 30%;padding:10px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tut h4{margin:12px 0 4px}
.tut p,.tut li{font-size:14px;line-height:1.45}
.tut ul{padding-left:18px;margin:6px 0}
/* ===== Tema Padrão: mesmo estilo da tela de bloqueio ===== */
[data-theme=padrao] body,[data-theme=padrao] button,[data-theme=padrao] input,[data-theme=padrao] select{font-family:var(--fn)}
[data-theme=padrao] header{background:#000;border-bottom:1px solid #1f1f1f;gap:8px}
[data-theme=padrao] header h1{font-weight:300;letter-spacing:.07em;font-size:17px}
[data-theme=padrao] header .hc{width:36px;height:36px;border:1.5px solid #ffffff55;border-radius:50%;padding:0;font-size:17px;font-weight:400;display:flex;align-items:center;justify-content:center;flex:none;line-height:1;color:#fff}
[data-theme=padrao] header .hc svg{width:19px;height:19px}
[data-theme=padrao] header .bk{font-size:22px;padding-bottom:3px}
[data-theme=padrao] .card{border-radius:22px;background:var(--card)}
[data-theme=padrao] .total{background:#1c1c1c;border:1px solid #333;color:#fff}
[data-theme=padrao] .total small{color:#a8a8a8}
[data-theme=padrao] .total .v{font-weight:300;letter-spacing:.02em}
[data-theme=padrao] .nm span{font-weight:300;letter-spacing:.06em}
[data-theme=padrao] .big{font-weight:400}
[data-theme=padrao] .btn{border-radius:28px;background:var(--card)}
[data-theme=padrao] .add{background:#3a3a3a;color:#fff;border-radius:999px;letter-spacing:.04em}
[data-theme=padrao] .danger{background:#7a2b2b}
[data-theme=padrao] .add.cancel{background:transparent;border:1px solid #444;color:#eee}
[data-theme=padrao] .mini{background:#3a3a3a;border-radius:999px}
[data-theme=padrao] .mini.alt{background:transparent;border:1px solid #555;color:#eee}
[data-theme=padrao] .nav{border-radius:999px}
[data-theme=padrao] .eye{border-radius:999px}
[data-theme=padrao] .seg button{border-radius:999px}
[data-theme=padrao] .seg button.on{background:#3a3a3a;border-color:#666}
[data-theme=padrao] .tag{border-radius:999px}
[data-theme=padrao] input,[data-theme=padrao] select{border-radius:16px}
[data-theme=padrao] .sheet{border-radius:0 0 26px 26px}
</style>
</head>
<body>
<div id="lock">
  <div class="wm">Minha Vida Financeira</div>
  <button class="ub" onclick="desbloquear()">Desbloquear</button>
  <p id="lockmsg" class="warn"></p>
  <button class="ic" style="font-size:12px;color:#ffffff66;margin-top:26px" onclick="esqueci()">Não consigo desbloquear</button>
</div>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ---------- utilitários ---------- */
const KEY='vidaFinanceira';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function cur(){return today().slice(0,7)}
const r2=x=>Math.round(x*100)/100;
const rq=x=>Math.round(x*1e6)/1e6;
const num=x=>parseFloat(String(x).replace(',','.'))||0;
const sumv=a=>r2(a.reduce((t,x)=>t+x,0));
const fmt=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fdate=d=>d.split('-').reverse().join('/');
const addM=(ym,i)=>{let [y,m]=ym.split('-').map(Number);m+=i;y+=Math.floor((m-1)/12);m=((m-1)%12)+1;return y+'-'+String(m).padStart(2,'0')};
const mlabel=ym=>{const [y,m]=ym.split('-');const s=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)};
const opts=(a,f=x=>esc(x.nome))=>a.map(x=>`<option value="${x.id}">${f(x)}</option>`).join('');
function dataMes(mes,dia){const [y,m]=mes.split('-').map(Number),ult=new Date(y,m,0).getDate();return mes+'-'+String(Math.min(dia,ult)).padStart(2,'0')}
const catsPadrao=()=>({
  in:[{id:'ci1',nome:'Ganho comum',rec:false,valor:0},{id:'ci2',nome:'Salário',rec:true,valor:0},{id:'ci3',nome:'Ações',rec:false,valor:0}],
  out:[{id:'co1',nome:'Mercado',rec:false,valor:0},{id:'co2',nome:'Gasolina',rec:false,valor:0},{id:'co3',nome:'Aluguel',rec:false,valor:0},{id:'co4',nome:'Outros',rec:false,valor:0},{id:'co5',nome:'Ações',rec:false,valor:0}]
});
const FLAGS=()=>({acoes:1,divcat:1,divauto:1,tpadrao:1,cartaoDiv:1});
const DEF=()=>({nome:'',inv:[],contas:[],cartoes:[],dividas:[],dinheiro:0,movs:[],ops:[],transf:[],cats:catsPadrao(),snaps:{},led:null,hide:false,tema:'padrao',flags:FLAGS()});

/* ---------- estado + migração ---------- */
const _st=JSON.parse(localStorage.getItem(KEY)||'null');
let S=Object.assign(DEF(),_st||{});
if(_st)S.flags=_st.flags||{};
S.nome=typeof S.nome==='string'?S.nome:'';
S.cats=S.cats||catsPadrao();S.cats.in=S.cats.in||[];S.cats.out=S.cats.out||[];
if(!S.flags.acoes){
  [['in','ci3'],['out','co5']].forEach(([tp,id])=>{if(!S.cats[tp].some(c=>c.nome==='Ações'))S.cats[tp].push({id,nome:'Ações',rec:false,valor:0})});
  S.flags.acoes=1;
}
S.dividas=S.dividas.map(d=>(d.parcelas||d.kind)?d:{id:d.id,nome:d.nome,tipo:'Outros',inst:'',total:d.valor,n:1,parcelas:[{id:uid(),valor:d.valor,mes:cur(),paga:false}]});
S.dividas.forEach(d=>{
  if(!d.kind)d.kind='parc';
  if(d.kind==='parc'&&!d.cartao&&d.inst&&d.tipo==='Cartão de crédito'){
    let c=S.cartoes.find(x=>x.nome===d.inst);
    if(!c){c={id:uid(),nome:d.inst};S.cartoes.push(c)}
    d.cartao=c.id;
  }
});
S.movs.forEach(m=>{
  if(m.pg&&!m.pgs){m.pgs=[m.pg];delete m.pg}
  if(m.debt&&!m.cartaoId){const d=S.dividas.find(x=>x.id===m.debt);if(d&&d.cartao)m.cartaoId=d.cartao}
  if(m.cat==='Ganho/perda em ações')m.cat='Ações';
  if(!m.cat)m.cat=m.rend?'Rendimento de investimento':m.auto?'Ações':m.pgs?'Pagamento de dívidas':m.tipo==='in'?'Ganho comum':'Outros';
});
/* toda dívida tem uma categoria de saída (usada quando ela é paga) */
S.dividas.forEach(d=>{
  if(!d.cat){
    const m=S.movs.find(x=>x.debt===d.id);
    d.cat=(m&&m.cat&&m.cat!=='Pagamento de dívidas')?m.cat:'Outros';
  }
});
if(!S.flags.divcat){
  S.movs.forEach(m=>{
    if(m.pgs&&m.pgs.length&&m.cat==='Pagamento de dívidas'){
      const cs=[...new Set(m.pgs.map(p=>{const d=S.dividas.find(x=>x.id===p.d);return d?d.cat:null}))];
      if(cs.length===1&&cs[0])m.cat=cs[0];
    }
  });
  S.flags.divcat=1;
}
const brl=v=>S.hide?'R$ ••••':fmt(v);
const find=(k,id)=>S[k].find(x=>x.id===id);
const V=x=>x.tipo==='Ações'?r2(x.preco*x.qtd):x.valor;
/* total de movimentações: ignora lançamentos futuros */
const totMov=ms=>sumv(ms.filter(m=>!m.pend).map(m=>m.valor));
const fut=m=>!m.sem&&m.data>today();

/* Saída no futuro não existe: vira dívida. Débitos futuros e categorias de saída recorrentes antigos são convertidos. */
if(!S.flags.divauto){
  S.movs.filter(m=>m.tipo==='out'&&m.pend).forEach(m=>{
    const conta=(m.meio==='conta'&&find('contas',m.ref))?m.ref:null;
    S.dividas.push({id:uid(),nome:m.desc,tipo:'Outros',cat:m.cat||'Outros',cartao:null,venc:parseInt(m.data.slice(8,10)),
      kind:'parc',total:m.valor,n:1,parcelas:[{id:uid(),valor:m.valor,mes:m.data.slice(0,7),paga:false}],
      auto:!!conta,autoConta:conta,autoDesde:m.data});
  });
  S.movs=S.movs.filter(m=>!(m.tipo==='out'&&m.pend));
  S.cats.out.forEach(c=>{
    if(c.rec&&c.valor>0&&c.dia&&c.dest&&c.ini){
      let mi=c.ini;while(c.gen&&c.gen[mi])mi=addM(mi,1);
      const dest=String(c.dest),conta=(dest.indexOf('c:')===0&&find('contas',dest.slice(2)))?dest.slice(2):null;
      S.dividas.push({id:uid(),nome:c.nome,tipo:'Outros',cat:c.nome,cartao:null,venc:c.dia,kind:'assin',valor:c.valor,inicio:mi,fim:null,pagos:{},
        auto:!!conta,autoConta:conta,autoDesde:dataMes(mi,c.dia)});
    }
    c.rec=false;delete c.ini;delete c.gen;delete c.dia;delete c.dest;
  });
  S.flags.divauto=1;
}
/* o app passa a iniciar no Tema Padrão (uma única vez; depois vale a escolha do usuário) */
if(!S.flags.tpadrao){S.tema='padrao';S.flags.tpadrao=1}
/* compra no cartão não é saída: os antigos registros dela em Saídas saem da lista (a dívida continua no cartão) */
if(!S.flags.cartaoDiv){S.movs=S.movs.filter(m=>!(m.debt&&m.sem));S.flags.cartaoDiv=1}

/* fotos antigas sem id: liga cada conta/investimento pelo nome (uma única vez) */
Object.keys(S.snaps||{}).forEach(k=>{
  const sn=S.snaps[k];
  (sn.contas||[]).forEach(x=>{if(!x.id){const a=S.contas.find(z=>z.nome===x.n);if(a)x.id=a.id}});
  (sn.inv||[]).forEach(x=>{if(!x.id){const a=S.inv.find(z=>z.nome===x.n);if(a)x.id=a.id}});
});

/* executa uma alteração e desfaz tudo se algo falhar */
function tx(fn){
  const bak=JSON.stringify(S);let ok=false;
  try{ok=fn()}catch(e){ok=false;console.error(e)}
  if(!ok)S=JSON.parse(bak);
  return ok;
}

/* fotos mensais dos saldos (para os relatórios de meses anteriores) */
function buildSnap(){return{contas:S.contas.map(c=>({id:c.id,n:c.nome,v:c.valor})),inv:S.inv.map(i=>({id:i.id,n:i.nome,t:i.tipo,v:V(i),q:i.qtd})),din:S.dinheiro}}
function snap(){
  S.snaps=S.snaps||{};
  const m=cur(),ks=Object.keys(S.snaps).sort(),last=ks[ks.length-1];
  if(last&&last<m)for(let k=addM(last,1);k<m;k=addM(k,1)){const c=JSON.parse(JSON.stringify(S.snaps[last]));c.est=1;S.snaps[k]=c}
  S.snaps[m]=buildSnap();
}
/* foto de um mês passado, mas com os nomes e tipos ATUAIS (renomear conta/investimento vale para todos os meses) */
function snapVivo(sn){
  const c=JSON.parse(JSON.stringify(sn));
  c.contas.forEach(x=>{const a=x.id&&find('contas',x.id);if(a)x.n=a.nome});
  c.inv.forEach(x=>{const a=x.id&&find('inv',x.id);if(a){x.n=a.nome;x.t=a.tipo}});
  return c;
}
const snapDe=mes=>mes===cur()?buildSnap():(S.snaps[mes]?snapVivo(S.snaps[mes]):null);

/* livro-razão: efeito líquido dos registros em cada mês (contas, dinheiro e investimentos de valor fixo).
   A cada gravação ele é recalculado; a diferença corrige as fotos dos meses seguintes,
   assim editar, apagar ou incluir um registro antigo corrige os saldos dos relatórios de meses passados. */
function montaLivro(){
  const L={};
  const g=mes=>L[mes]||(L[mes]={c:{},i:{},d:0});
  const somaC=(mes,id,v)=>{if(id){const o=g(mes);o.c[id]=r2((o.c[id]||0)+v)}};
  const somaI=(mes,id,v)=>{if(id){const o=g(mes);o.i[id]=r2((o.i[id]||0)+v)}};
  S.movs.forEach(m=>{
    if(m.sem||m.pend||m.meio==='cartao')return;
    const mes=m.data.slice(0,7);
    if(m.rend){const i=find('inv',m.rend);if(i&&i.tipo!=='Ações')somaI(mes,i.id,m.valor);return}
    const x=m.tipo==='in'?m.valor:-m.valor;
    if(m.meio==='dinheiro'){const o=g(mes);o.d=r2(o.d+x)}else somaC(mes,m.ref,x);
  });
  S.transf.forEach(t=>{
    const mes=t.data.slice(0,7);
    somaC(mes,t.de,-t.valor);
    if(t.tipo==='tr')somaC(mes,t.para,t.valor);else{const o=g(mes);o.d=r2(o.d+t.valor)}
  });
  S.ops.forEach(o=>{
    const mes=o.data.slice(0,7),cid=o.contaId||(opConta(o)||{}).id,inv=opInvest(o),iid=o.invId||(inv||{}).id;
    somaC(mes,cid,o.dir==='inv'?-o.total:o.total);
    if(!o.q&&!(inv&&inv.tipo==='Ações'))somaI(mes,iid,o.dir==='inv'?o.total:-o.total);
  });
  return L;
}
function reconcSnaps(){
  const novo=montaLivro(),velho=S.led;
  S.led=novo;
  if(!velho)return;
  const cm=cur(),vz={c:{},i:{},d:0};
  Object.keys(Object.assign({},velho,novo)).forEach(M=>{
    const a=velho[M]||vz,b=novo[M]||vz,dc={},di={};
    new Set(Object.keys(a.c).concat(Object.keys(b.c))).forEach(id=>{const d=r2((b.c[id]||0)-(a.c[id]||0));if(Math.abs(d)>=0.005)dc[id]=d});
    new Set(Object.keys(a.i).concat(Object.keys(b.i))).forEach(id=>{const d=r2((b.i[id]||0)-(a.i[id]||0));if(Math.abs(d)>=0.005)di[id]=d});
    const dd=r2(b.d-a.d);
    if(!Object.keys(dc).length&&!Object.keys(di).length&&Math.abs(dd)<0.005)return;
    Object.keys(S.snaps).forEach(k=>{
      if(k<M||k>=cm)return;
      const sn=S.snaps[k];
      sn.contas.forEach(x=>{if(x.id&&dc[x.id])x.v=r2(x.v+dc[x.id])});
      sn.inv.forEach(x=>{if(x.id&&di[x.id])x.v=r2(x.v+di[x.id])});
      sn.din=r2(sn.din+dd);
    });
  });
}
/* ---------- SINCRONIA: dados copiados nos registros sempre seguem a origem ----------
   Pagamentos de dívidas/faturas ficam sempre na categoria ATUAL de cada dívida paga
   (se as dívidas de uma fatura têm categorias diferentes, o pagamento é dividido por categoria)
   e o texto do pagamento acompanha o nome atual da dívida/cartão. */
function tituloPag(base,pgs){
  const ks=pgs.map(p=>({d:find('dividas',p.d),p:p.p})).filter(x=>x.d);
  if(!ks.length)return base;
  const x=ks[0],d=x.d;
  if(base.indexOf('Fatura ')===0){
    const c=d.cartao?find('cartoes',d.cartao):null;
    const mes=d.kind==='assin'?x.p:((d.parcelas.find(q=>q.id===x.p)||{}).mes);
    return c&&mes?'Fatura '+c.nome+' · '+mlabel(mes):base;
  }
  if(base.indexOf('Pagamento: ')===0&&ks.length===1)return 'Pagamento: '+d.nome+' ('+rotulo(d,x.p)+')';
  return base;
}
function sincPagamentos(){
  const novos=[];
  S.movs.forEach(m=>{
    if(!m.pgs||!m.pgs.length)return;
    const grp={};
    m.pgs.forEach(p=>{const d=find('dividas',p.d);const k=d?(d.cat||'Outros'):(m.cat||'Outros');(grp[k]=grp[k]||[]).push(p)});
    const cats=Object.keys(grp);
    const sufOld=!!m.cat&&String(m.desc).endsWith(' · '+m.cat);
    const base=sufOld?String(m.desc).slice(0,-(3+m.cat.length)):String(m.desc);
    const nb=m.dman?base:tituloPag(base,m.pgs);
    const suf=cats.length>1||sufOld;
    const dsc=k=>nb+(suf?' · '+k:'');
    if(cats.length>1){
      const extra=cats.slice(1).map(k=>({k,v:sumv(grp[k].map(p=>valorKey(p.d,p.p)))}));
      const resto=r2(m.valor-sumv(extra.map(e=>e.v)));
      if(resto>0.004&&extra.every(e=>e.v>0.004)){
        extra.forEach(e=>novos.push(Object.assign({},m,{id:uid(),cat:e.k,valor:e.v,pgs:grp[e.k],desc:dsc(e.k)})));
        m.valor=resto;m.pgs=grp[cats[0]];m.cat=cats[0];m.desc=dsc(cats[0]);
        return;
      }
    }
    m.cat=cats[0];m.desc=dsc(cats[0]);
  });
  if(novos.length)S.movs=S.movs.concat(novos);
}

/* ---------- vencimento, fechamento e fatura ---------- */
function vDia(d){const c=d.cartao?find('cartoes',d.cartao):null;return c?c.venc:d.venc}
function vData(mes,dia){
  if(!dia)return '';
  const [y,m]=mes.split('-').map(Number),ult=new Date(y,m,0).getDate();
  return String(Math.min(dia,ult)).padStart(2,'0')+'/'+String(m).padStart(2,'0');
}
function lerDia(v){const n=parseInt(v);return(n>=1&&n<=31)?n:0}
/* Em qual fatura (mês de vencimento) entra uma compra feita em "data".
   Com fechamento: compra até o dia do fechamento entra na fatura que fecha neste mês;
   depois do fechamento, na que fecha no mês seguinte.
   Se o vencimento é depois do fechamento (ex.: fecha 5, vence 15), a fatura vence no mesmo mês em que fecha;
   senão (ex.: fecha 27, vence 5), vence no mês seguinte ao fechamento.
   Cartões antigos sem fechamento definido usam a regra anterior. */
function mesFatura(data,card){
  const mes=data.slice(0,7),d=parseInt(data.slice(8,10));
  const venc=card&&card.venc,fech=card&&card.fech;
  if(fech&&venc){
    const fm=d<=fech?mes:addM(mes,1);
    return venc>fech?fm:addM(fm,1);
  }
  return(d>=27||(venc&&d>venc))?addM(mes,1):mes;
}
function textoFatura(data,card){
  if(!data||!card)return '';
  const m=mesFatura(data,card);
  return 'Entra na fatura de '+mlabel(m)+(card.venc?' (vence '+vData(m,card.venc)+')':'');
}

/* ---------- dívidas: itens mensais (parcelas e assinaturas) ---------- */
const ativa=d=>d.kind==='assin'&&(!d.fim||d.fim>=cur());
const ateM=m=>m>cur()?m:cur();
function itens(filtro=()=>true,ate=cur()){
  const out=[];
  S.dividas.filter(filtro).forEach(d=>{
    if(d.kind==='assin'){
      const fim=d.fim&&d.fim<ate?d.fim:ate;
      for(let m=d.inicio;m<=fim;m=addM(m,1))out.push({d,pid:m,mes:m,valor:d.valor,paga:!!d.pagos[m]});
    }else d.parcelas.forEach((p,i)=>out.push({d,pid:p.id,mes:p.mes,valor:p.valor,paga:p.paga,i}));
  });
  return out;
}
/* data de vencimento de uma cobrança (null se a dívida não tem dia de vencimento) */
function dueOf(d,mes){const dia=vDia(d);return dia?dataMes(mes,dia):null}
/* cobrança em atraso: passou do vencimento e não foi paga */
function atrasada(x){
  if(x.paga)return false;
  const du=dueOf(x.d,x.mes);
  return du?du<today():x.mes<cur();
}
function resumo(filtro){
  const rest=itens(filtro).filter(x=>!x.paga),as=S.dividas.filter(filtro).filter(ativa),atr=rest.filter(atrasada);
  return{total:sumv(rest.map(x=>x.valor)),nParc:rest.filter(x=>x.d.kind==='parc').length,
    compras:sumv(rest.filter(x=>x.d.kind==='parc').map(x=>x.valor)),
    mes:sumv(rest.filter(x=>x.mes<=cur()).map(x=>x.valor)),nAss:as.length,ass:sumv(as.map(d=>d.valor)),
    atraso:sumv(atr.map(x=>x.valor)),nAtr:atr.length};
}
/* resumo de um mês específico (pagas + abertas) */
function resMes(filtro,mes){
  const its=itens(filtro,ateM(mes)).filter(x=>x.mes===mes),ab=its.filter(x=>!x.paga);
  return{total:sumv(its.map(x=>x.valor)),aberto:sumv(ab.map(x=>x.valor)),n:its.length,nAb:ab.length};
}
function totais(){
  const r=resumo(()=>true);
  return{inv:sumv(S.inv.map(V)),contas:sumv(S.contas.map(x=>x.valor)),din:S.dinheiro,div:r.total,compras:r.compras,nRest:r.nParc,mes:r.mes,nAss:r.nAss,ass:r.ass,atraso:r.atraso};
}

<li>Tudo o que você registra atualiza contas, dinheiro, dívidas e a tela inicial.</li></ul>`},
entradas:{t:'Entradas',h:`<p>Registre tudo o que entra.</p><ul>
<li>Escolha a <b>categoria</b> (Ganho comum, Salário, Ações…). Em <b>➕ Nova categoria</b> você cria, edita (✎) ou remove categorias.</li>
<li><b>Recorrente 🔁 (ex.: Salário):</b> na categoria, informe o valor, o dia do mês e onde o dinheiro entra (conta, dinheiro ou investimento). O app lança <b>sozinho na data</b> e atualiza o saldo. Antes da data, o registro aparece como <b>Lançamento futuro</b>. Se o dia deste mês já passou quando você configurar, o primeiro lançamento é no mês seguinte. Enquanto a categoria não estiver configurada, aparece um aviso amarelo.</li>
<li><b>Ganhos futuros:</b> escolha uma data futura ao registrar. Fica como lançamento futuro e só entra nos saldos nessa data. O total do mês soma só o que já foi realizado; o resto aparece como "A receber".</li>
<li><b>Onde entra:</b> Dinheiro, Conta bancária ou Investimento (poupança etc.). A categoria <b>Rendimento de investimento</b> soma direto no investimento escolhido.</li>
<li>A categoria <b>Ações</b> recebe automaticamente os ganhos das vendas de ações com lucro. É só informativo: o valor da venda já entrou na conta.</li>
<li>A descrição é opcional. Se ficar em branco, vale o nome da categoria.</li>
<li><b>✎</b> edita qualquer dado do registro (valor, data, categoria, destino). <b>🗑</b> exclui e reverte o saldo.</li></ul>`},
saidas:{t:'Saídas',h:`<p>Registre o que você já pagou ou gastou.</p><ul>
<li>Escolha a <b>categoria</b> (Mercado, Gasolina, Aluguel, Ações…). Em <b>➕ Nova categoria</b> você cria, edita (✎) ou remove categorias.</li>
<li>Escolha como pagou: <b>Dinheiro</b> ou <b>Conta bancária</b>. O saldo é debitado na hora.</li>
<li><b>Não existe saída no futuro nem compra no cartão aqui.</b> Compra no cartão ainda não tirou dinheiro do seu patrimônio, e compromissos futuros ainda não aconteceram. Registre-os em <b>Dívidas</b>; eles viram saída quando pagos.</li>
<li>Se você tentar registrar uma saída com data futura, o app avisa para registrar como <b>Dívida</b>.</li>
<li>Os pagamentos de dívidas (manuais ou por débito automático) também aparecem aqui, na categoria da dívida.</li>
<li>A categoria <b>Ações</b> recebe automaticamente as perdas das vendas de ações. É só informativo: o valor da venda já entrou na conta.</li>
<li>A descrição é opcional. Se ficar em branco, vale o nome da categoria.</li>
<li><b>✎</b> edita qualquer dado do registro. <b>🗑</b> exclui e reverte o saldo.</li></ul>`},
editmov:{t:'Editar registro',h:`<p>Altere o que precisar e toque em <b>Salvar alterações</b>. Os saldos são recalculados automaticamente.</p><ul>
<li>Você pode mudar categoria, descrição, valor, data e onde o dinheiro entrou ou saiu.</li>
<li><b>Pagamentos de dívidas</b> não permitem mudar o valor (ele vem das cobranças pagas), mas dá para mudar descrição, categoria, data e a conta usada. Excluir um pagamento aqui equivale a usar o <b>↩ desfazer</b> em Dívidas: a cobrança volta a ficar em aberto.</li>
<li><b>Ganho ou perda de ações</b> é um registro informativo: dá para ajustar descrição, categoria, valor e data, sem mexer em nenhum saldo.</li>
<li>Entradas com data futura viram lançamento futuro. Saídas não podem ter data futura: use Dívidas.</li></ul>`},
hist:{t:'Relatórios',h:`<p>Veja e exporte relatórios de qualquer mês, com gráficos.</p><ul>
<li>Escolha o mês nas setas <b>‹ ›</b> ou no campo de data. Os gráficos e as listas acompanham o mês escolhido.</li>
<li>Os relatórios se corrigem sozinhos: qualquer registro que você editar, apagar ou incluir (valor, nome, categoria, data…) já aparece atualizado, inclusive nos saldos de meses anteriores.</li>
<li><b>Resumo:</b> total de entradas, saídas e saldo do mês, com os totais por categoria (sem gráfico).</li>
<li><b>Entradas</b> e <b>Saídas:</b> gráfico de pizza por categoria e, abaixo, todos os lançamentos do mês divididos por categoria. Toque numa categoria para ver os lançamentos. Os pagamentos de dívidas aparecem na categoria de saída de cada dívida.</li>
<li><b>Dívidas/cartões:</b> gráfico de pizza com o peso de cada cartão e de cada dívida nas cobranças do mês, já dividido por categoria (a legenda mostra cartão/dívida · categoria), e a lista com o que está pago, em aberto e em atraso, mais os pagamentos efetuados (inclusive por débito automático).</li>
<li><b>Ações:</b> gráfico de pizza com ganhos, perdas e tarifas (saídas lançadas na categoria Ações) do mês, o resultado líquido e todas as movimentações em ordem cronológica.</li>
<li><b>Contas:</b> gráfico de pizza com o saldo de cada conta e do dinheiro em espécie, e as movimentações do mês (entradas, saídas, pagamentos, transferências, saques, aplicações e resgates).</li>
<li><b>Investimentos:</b> gráfico de pizza por tipo de investimento, posição no fim do mês, aplicações, resgates e rendimentos.</li>
<li><b>Patrimônio:</b> gráfico de pizza (contas, dinheiro e investimentos) e gráfico de barras com a evolução do patrimônio nos últimos meses. A barra verde é o mês escolhido.</li>
<li>Valores negativos (por exemplo, uma conta no vermelho) não entram nos gráficos de pizza. Com o olho ativado, os valores ficam escondidos também nos gráficos.</li>
<li><b>Exportar:</b> gera um arquivo HTML com os gráficos e as listas, que abre em qualquer navegador e pode ser guardado no Google Drive.</li>
<li>Os saldos de meses anteriores só existem a partir da primeira vez que o app foi aberto com a versão que guarda o histórico. A situação "paga/em aberto" das dívidas é sempre a atual.</li></ul>`},
config:{t:'Configurações',h:`<ul>
<li><b>Tutorial:</b> abre o guia completo do app.</li>
<li><b>Tema:</b> o app inicia no Tema Padrão (preto e cinza, de letras elegantes). Você pode mudar para o Tema Escuro ou o Tema Claro e voltar ao Padrão quando quiser.</li>
<li><b>Bloqueio:</b> pede a senha, o padrão ou a biometria do celular ao abrir o app. Você escolhe quando bloquear (ao sair do app, ou após 1, 5 ou 15 minutos) e pode bloquear na hora. Precisa do app aberto pelo link https e de senha ou biometria configurada no celular. Se você perder o acesso, "Não consigo desbloquear" apaga os dados do app, então mantenha um backup.</li>
<li><b>Backup – Exportar dados:</b> gera o arquivo <b>nome-mês-ano.json</b>, com o nome cadastrado na tela inicial e o mês e o ano atuais (ex.: maria-10-2026.json). Sem nome cadastrado, o arquivo se chama backup-mês-ano.json. Guarde-o em lugar seguro, como o Google Drive: ele contém todos os seus dados.</li>
<li><b>Backup – Importar backup:</b> substitui todos os dados atuais pelos do arquivo escolhido. Use para trocar de celular ou recuperar seus dados. Se o backup não tiver nome (versões antigas do app), a tela inicial pede o nome de novo.</li>
<li><b>Apagar tudo:</b> remove todos os dados (nome, contas, cartões, dívidas, investimentos, dinheiro e registros). Só o tema é mantido, e a tela inicial volta a pedir o nome. Não dá para desfazer.</li></ul>`},
tutorial:{t:'Tutorial',h:`<p>Este é o guia completo do app, com um tópico para cada tela.</p>`}
};

/* ---------- contas / dinheiro ---------- */
function addConta(){
  const nome=$('n').value.trim();if(!nome)return alert('Informe o nome.');
  S.contas.push({id:uid(),nome,valor:r2(num($('v').value))});save();render();
}
function editaConta(id){
  const c=find('contas',id);
  openModal(`<div class="row"><h3 style="margin:0">Editar conta</h3><button class="ic" onclick="closeModal()">✕</button></div>
  <small>Nome</small><input id="en" value="${esc(c.nome)}">
  <small>Saldo</small><input id="ev" type="number" step="0.01" inputmode="decimal" value="${c.valor}">
  <button class="add" onclick="salvaConta('${id}')">Salvar</button><button class="add cancel" onclick="closeModal()">Cancelar</button>`);
}
function salvaConta(id){
  const c=find('contas',id),nome=$('en').value.trim();if(!nome)return alert('Informe o nome.');
  S.ops.forEach(o=>{if(o.contaId===id||(!o.contaId&&o.conta===c.nome)){o.conta=nome;o.contaId=id}});
  S.transf.forEach(t=>{if(t.de===id)t.deNome=nome;if(t.para===id)t.paraNome=nome});
  c.nome=nome;c.valor=r2(num($('ev').value));save();closeModal();render();
}
function delItem(k,id){if(confirm('Remover este item?')){S[k]=S[k].filter(x=>x.id!==id);save();render()}}
function ajustaDinheiro(){const v=prompt('Saldo em dinheiro:',S.dinheiro);if(v===null)return;S.dinheiro=r2(num(v));save();render()}

/* ---------- TRANSFERÊNCIA / SAQUE ---------- */
function opTransf(eid){
  if(!S.contas.length)return alert('Cadastre antes uma conta bancária.');
  TEDIT=eid||null;
  openModal(`<h3 style="margin-top:0">${eid?'Editar transferência / saque':'Transferir / Sacar'}</h3>
  <select id="tq" onchange="updTq()"><option value="tr">⇄ Transferência entre contas</option><option value="sq">💵 Saque (conta → dinheiro em espécie)</option></select>
  <small>Da conta</small><select id="tde" onchange="updTq()">${opts(S.contas,x=>esc(x.nome)+' ('+fmt(x.valor)+')')}</select>
  <div id="tpw"></div>
  <input id="tv" type="number" step="0.01" inputmode="decimal" placeholder="Valor">
  <input id="td" type="date" value="${today()}">
  <button class="add" onclick="execTransf()">${eid?'Salvar alterações':'Confirmar'}</button><button class="add cancel" onclick="closeModal()">Cancelar</button>`);
  updTq();
  if(eid){
    const t=S.transf.find(z=>z.id===eid);
    if(t){$('tq').value=t.tipo;if(find('contas',t.de))$('tde').value=t.de;updTq();
      if(t.tipo==='tr'&&$('tpa')&&find('contas',t.para))$('tpa').value=t.para;
      $('tv').value=t.valor;$('td').value=t.data}
  }
}
function updTq(){
  const tp=$('tq').value,de=$('tde').value;
  if(tp==='sq'){$('tpw').innerHTML='<small>Destino: Dinheiro (em espécie)</small>';return}
  const prev=$('tpw').querySelector('select')?$('tpw').querySelector('select').value:'';
  const L2=S.contas.filter(x=>x.id!==de);
  if(!L2.length){$('tpw').innerHTML='<p class="warn">Cadastre uma segunda conta para transferir.</p>';return}
  $('tpw').innerHTML='<small>Para a conta</small><select id="tpa">'+opts(L2)+'</select>';
  if(L2.some(x=>x.id===prev))$('tpa').value=prev;
}
function revertTransf(t){
  const de=find('contas',t.de);if(de)de.valor=r2(de.valor+t.valor);
  if(t.tipo==='tr'){const pa=find('contas',t.para);if(pa)pa.valor=r2(pa.valor-t.valor)}
  else S.dinheiro=r2(S.dinheiro-t.valor);
}
function execTransf(){
  const tp=$('tq').value,deId=$('tde').value,v=r2(num($('tv').value)),data=$('td').value,paId=$('tpa')?$('tpa').value:null;
  if(!find('contas',deId)||!data||v<=0)return alert('Preencha conta, valor e data.');
  if(tp==='tr'){
    if(!paId)return alert('Cadastre uma segunda conta para transferir.');
    if(paId===deId)return alert('Escolha uma conta de destino diferente.');
  }
  const ok=tx(()=>{
    if(TEDIT){const t=S.transf.find(z=>z.id===TEDIT);if(t){revertTransf(t);S.transf=S.transf.filter(z=>z.id!==TEDIT)}}
    const de=find('contas',deId),para=tp==='tr'?find('contas',paId):null;
    if(!de||(tp==='tr'&&!para))return false;
    if(de.valor<v&&!confirm('O saldo da conta é menor que o valor. Continuar?'))return false;
    de.valor=r2(de.valor-v);
    if(para)para.valor=r2(para.valor+v);else S.dinheiro=r2(S.dinheiro+v);
    S.transf.push({id:uid(),tipo:tp,data,de:de.id,deNome:de.nome,para:para?para.id:null,paraNome:para?para.nome:'',valor:v});
    save();return true;
  });
  if(ok){closeModal();render()}
}
function delTransf(id){
  const t=S.transf.find(x=>x.id===id);if(!t)return;
  if(!confirm('Desfazer este registro? Os saldos serão revertidos.'))return;
  revertTransf(t);S.transf=S.transf.filter(x=>x.id!==id);save();render();
}

function salvaInv(id){

function rendDe(id){preset=id;go('entradas')}

/* Investir / Resgatar (criar, editar e desfazer) */
const opConta=o=>(o.contaId&&find('contas',o.contaId))||S.contas.find(c=>c.nome===o.conta);
const opInvest=o=>(o.invId&&find('inv',o.invId))||S.inv.find(i=>i.nome===o.inv);
function opInv(eid){
  if(!S.contas.length)return alert('Cadastre antes uma conta bancária.');
  OPEDIT=eid||null;
  openModal(`<h3 style="margin-top:0">${eid?'Editar operação':'Investir / Resgatar'}</h3>
  <select id="oq" onchange="updDir()"><option value="inv">Investir (conta → investimento)</option><option value="res">Resgatar (investimento → conta)</option></select>
  <small>Investimento</small><select id="oi" onchange="updOp()"></select>
  <div id="onw"></div>
  <small>Conta bancária</small><select id="oc">${opts(S.contas)}</select>
  <div id="of"></div><div id="ot" class="sub"></div>
  <input id="od" type="date" value="${today()}">
  <button class="add" onclick="execOp()">${eid?'Salvar alterações':'Confirmar'}</button><button class="add cancel" onclick="closeModal()">Cancelar</button>`);
  updDir();
  if(eid){
    const o=S.ops.find(z=>z.id===eid);
    if(o){
      $('oq').value=o.dir;updDir();
      const iv=opInvest(o);if(iv)$('oi').value=iv.id;
      updOp();
      const c=opConta(o);if(c)$('oc').value=c.id;
      if(o.q){$('op').value=o.p;$('oqt').value=o.q}else $('ov').value=o.total;
      $('od').value=o.data;totOp();
    }
  }
}
function updDir(){
  const dir=$('oq').value,prev=$('oi').value;
  let h=opts(S.inv,x=>esc(x.nome)+' ('+esc(x.tipo)+')');
  if(dir==='inv')h+='<option value="__new">➕ Novo investimento…</option>';
  if(!h)h='<option value="">Nenhum investimento para resgatar</option>';
  $('oi').innerHTML=h;
  if([...$('oi').options].some(o=>o.value===prev))$('oi').value=prev;
  else if(dir==='inv'&&!S.inv.length)$('oi').value='__new';
  updOp();
}
function ctxOp(){
  const v=$('oi').value;
  if(v==='__new')return{novo:1,ac:$('nt')?$('nt').value==='Ações':false};
  const inv=find('inv',v);
  return{inv,ac:!!inv&&inv.tipo==='Ações'};
}
function updOp(){
  const novo=$('oi').value==='__new';
  $('onw').innerHTML=novo?`<input id="nn" placeholder="Nome do novo investimento (ex.: PETR4, Poupança Itaú)">
  <select id="nt" onchange="updTipo()">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select>`:'';
  updTipo();
}
function updTipo(){
  const x=ctxOp();
  $('of').innerHTML=x.ac
   ?`<input id="op" type="number" step="any" inputmode="decimal" placeholder="Preço unitário" oninput="totOp()"><input id="oqt" type="number" step="any" inputmode="decimal" placeholder="Quantidade${x.inv?' (em carteira: '+x.inv.qtd+')':''}" oninput="totOp()">`
   :`<input id="ov" type="number" step="0.01" inputmode="decimal" placeholder="Valor">`;
  totOp();
}
function totOp(){
  const x=ctxOp();if(!x.ac){$('ot').textContent='';return}
  const p=num($('op').value),q=num($('oqt').value),tot=r2(p*q);
  let s='Total: '+fmt(tot);
  if($('oq').value==='res'&&x.inv&&tot>0){const g=r2((p-x.inv.pm)*q);s+=' · '+(g>=0?'Ganho':'Perda')+' estimado: '+fmt(Math.abs(g))}
  $('ot').textContent=s;
}
/* reverte os efeitos de uma operação (conta, investimento e registro de ganho/perda) */
function revertOp(o){
  const c=opConta(o),inv=opInvest(o),ac=!!o.q;
  if(!inv){
    if(!confirm('O investimento "'+o.inv+'" não existe mais. Reverter apenas o saldo da conta?'))return false;
  }else if(o.dir==='inv'){
    if(ac){
      if(o.q>inv.qtd+1e-9){alert('Não dá para desfazer: parte dessas ações já foi vendida. Desfaça antes os resgates posteriores.');return false}
      const nq=rq(inv.qtd-o.q);
      inv.pm=nq>0?Math.max(0,(inv.pm*inv.qtd-o.p*o.q)/nq):0;inv.qtd=nq;
    }else{
      if(o.total>inv.valor+0.005&&!confirm('O saldo do investimento é menor que o valor aplicado. Continuar?'))return false;
      inv.valor=r2(inv.valor-o.total);
    }
    if(o.novo&&(ac?inv.qtd<=0:Math.abs(inv.valor)<0.005))S.inv=S.inv.filter(x=>x.id!==inv.id);
  }else{
    if(ac){
      const pmA=o.pmA!=null?o.pmA:(o.q?r2(o.p-(o.ganho||0)/o.q):0);
      if(inv.qtd<=0)inv.pm=pmA;
      inv.qtd=rq(inv.qtd+o.q);
    }else inv.valor=r2(inv.valor+o.total);
  }
  if(o.dir==='res'){
    S.movs=S.movs.filter(m=>o.movId?m.id!==o.movId:!(m.auto&&m.data===o.data&&o.ganho&&m.valor===Math.abs(o.ganho)&&String(m.desc).indexOf(o.inv)>=0));
  }
  if(c)c.valor=r2(c.valor+(o.dir==='inv'?o.total:-o.total));
  return true;
}
function aplicaOp(P){
  const c=find('contas',P.cid);if(!c)return false;
  let inv=find('inv',P.spec.id);
  if(!inv){
    if(P.dir==='res'){alert('Investimento não encontrado.');return false}
    inv=P.spec;S.inv.push(inv);
  }
  let ganho=0,pmA=null,movId=null;
  if(P.dir==='inv'){
    if(c.valor<P.total&&!confirm('O saldo da conta é menor que o valor. Continuar?'))return false;
    c.valor=r2(c.valor-P.total);
    if(P.ac){const nq=rq(inv.qtd+P.q);inv.pm=(inv.pm*inv.qtd+P.p*P.q)/nq;inv.qtd=nq;inv.preco=P.p}
    else inv.valor=r2(inv.valor+P.total);
  }else{
    if(P.ac){
      if(P.q>inv.qtd+1e-9){alert('Quantidade maior que a disponível ('+inv.qtd+').');return false}
      pmA=inv.pm;ganho=r2((P.p-inv.pm)*P.q);inv.qtd=rq(inv.qtd-P.q);inv.preco=P.p;if(inv.qtd<=0){inv.qtd=0;inv.pm=0}
      if(ganho!==0){
        movId=uid();
        S.movs.push({id:movId,tipo:ganho>0?'in':'out',desc:(ganho>0?'Ganho':'Perda')+' na venda de '+inv.nome+' ('+P.q+' × '+fmt(P.p)+')',
          valor:Math.abs(ganho),data:P.data,meio:'conta',ref:c.id,sem:1,auto:1,cat:catAcoes(ganho>0?'in':'out')});
      }
    }else{
      if(P.total>inv.valor+0.005){alert('Valor maior que o saldo do investimento.');return false}
      inv.valor=r2(inv.valor-P.total);
    }
    c.valor=r2(c.valor+P.total);
  }
  S.ops.push({id:uid(),data:P.data,dir:P.dir,inv:inv.nome,invId:inv.id,conta:c.nome,contaId:c.id,total:P.total,p:P.p,q:P.q,ganho,pmA,novo:!!P.novo,movId});
  save();return true;
}
function execOp(){
  const dir=$('oq').value,cid=$('oc').value,data=$('od').value,x=ctxOp(),eid=OPEDIT;
  if(!data||!find('contas',cid)||(!x.novo&&!x.inv))return alert('Preencha todos os campos.');
  const ac=x.ac;let p=0,q=0,total;
  if(ac){p=num($('op').value);q=num($('oqt').value);if(p<=0||q<=0)return alert('Informe preço unitário e quantidade.');total=r2(p*q)}
  else{total=r2(num($('ov').value));if(total<=0)return alert('Informe o valor.')}
  let spec;
  if(x.novo){
    const nome=$('nn').value.trim();if(!nome)return alert('Informe o nome do novo investimento.');
    const tp=$('nt').value;
    spec={id:uid(),nome,tipo:tp,...(tp==='Ações'?{preco:0,qtd:0,pm:0}:{valor:0})};
  }else spec={id:x.inv.id,nome:x.inv.nome,tipo:x.inv.tipo,...(ac?{preco:0,qtd:0,pm:0}:{valor:0})};
  const ok=tx(()=>{
    let novo=!!x.novo;
    if(eid){
      const o=S.ops.find(z=>z.id===eid);
      if(o){if(o.novo&&o.invId===spec.id)novo=true;if(!revertOp(o))return false;S.ops=S.ops.filter(z=>z.id!==eid)}
    }
    return aplicaOp({dir,spec,novo,cid,data,p,q,total,ac});
  });
  if(ok){closeModal();render()}
}
function delOp(id){
  const o=S.ops.find(z=>z.id===id);
  if(!o||!confirm('Desfazer esta operação? Os saldos da conta e do investimento serão revertidos.'))return;
  if(tx(()=>{if(!revertOp(o))return false;S.ops=S.ops.filter(z=>z.id!==id);save();return true}))render();
}

/* ---------- DÍVIDAS / CARTÕES ---------- */
function parcelar(total,n,mes,pagas){
  const base=Math.floor(total/n*100)/100;let acc=0;
  return Array.from({length:n},(_,i)=>{const v=i===n-1?r2(total-acc):base;acc=r2(acc+v);return{id:uid(),valor:v,mes:addM(mes,i),paga:i<pagas}});
}
const btnDesfaz=(did,pid)=>`<small class="pos">✓ paga</small> <button class="mini alt" onclick="desfazerPagDiv('${did}','${pid}')">↩ desfazer</button>`;
/* etiqueta de situação de uma cobrança em aberto */
function tagItem(x){
  if(x.paga)return '';
  if(atrasada(x))return '<span class="tag neg">Em atraso</span>';
  const c=cur();
  return x.mes===c?'<span class="tag">este mês</span>':x.mes>c?'<span class="tag">próxima</span>':'';

/* categorias de saída oferecidas para as dívidas (o valor é o nome da categoria) */
function catOutOpts(sel){

/* bloco de um mês (fatura) */
function blocoMes(its,cid,mes,dia){
  const c=cur();
  const L2=its.filter(x=>x.mes===mes),ab=L2.filter(x=>!x.paga),tot=sumv(ab.map(x=>x.valor)),all=sumv(L2.map(x=>x.valor));
  const tag=ab.some(atrasada)?'<span class="tag neg">Em atraso</span>':mes===c?'<span class="tag">este mês</span>':'';
  const venc=dia?`<br><small>vence ${vData(mes,dia)}</small>`:'';
  const dir=ab.length?`<b class="neg big">${brl(tot)}</b>`:`<span style="text-align:right"><b class="pos big">${brl(all)}</b><br><small class="pos">✓ paga</small></span>`;
  const fat=cid&&ab.length>1?`<div style="margin-top:6px"><button class="mini alt" onclick="pagarFatura('${cid}','${mes}')">Pagar fatura inteira (${brl(tot)})</button></div>`:'';
  return `<div class="card"><div class="row"><div><b>${mlabel(mes)}${tag}</b>${venc}</div>${dir}</div>${fat}`+
    L2.map(x=>`<div class="row it"><div><span>${esc(x.d.nome)}</span><br><small>${x.d.kind==='assin'?'🔁 assinatura mensal':'parcela '+(x.i+1)+'/'+x.d.n} · ${esc(x.d.cat||'Outros')}</small></div>
    <div style="text-align:right"><b>${brl(x.valor)}</b><br>${x.paga?btnDesfaz(x.d.id,x.pid):`<button class="mini" onclick="pagar('${x.d.id}','${x.pid}')">PAGAR</button>`}</div></div>`).join('')+'</div>';
}

/* lista de compras/assinaturas dentro de um cartão */
function cadList(L2){
  return L2.map(d=>{
    let info,mensal,acts='';
    if(d.kind==='assin'){
      const at=ativa(d);
      mensal=d.valor;
      info=`🔁 Assinatura · desde ${mlabel(d.inicio)}${d.fim?' · '+(at?'cobra até ':'encerrada em ')+mlabel(d.fim):' · ativa'}`;
      acts=d.fim?`<button class="mini" onclick="reativar('${d.id}')">Reativar</button>`:`<button class="mini alt" onclick="cancelAss('${d.id}')">Cancelar</button>`;
    }else{
      const rest=d.parcelas.filter(p=>!p.paga);
      mensal=d.parcelas[0].valor;
      info=`${d.n}x · restam ${rest.length} · total ${brl(d.total)} (aberto: ${brl(sumv(rest.map(p=>p.valor)))})`;
    }
    return `<div class="card row"><div><b>${esc(d.nome)}</b><br><b class="neg big">${brl(mensal)}/mês</b><br><small>${info}<br>Categoria de saída: ${esc(d.cat||'Outros')}</small></div>
    <div style="text-align:right">${acts}<br><button class="ic" onclick="editaDivida('${d.id}')">✎</button><button class="ic" onclick="delDivida('${d.id}')">🗑</button></div></div>`}).join('')||'<p class="sub">Nada cadastrado ainda.</p>';
}

/* card único de uma dívida (Outras dívidas): informações, cobranças e botões */
function cardDivida(d){
  const c=cur(),view=mesV!==c,its=itens(x=>x.id===d.id,ateM(mesV)),ab=its.filter(x=>!x.paga);
  let mostra;
  if(view)mostra=its.filter(x=>x.mes===mesV);
  else{const dev=ab.filter(x=>x.mes<=c);mostra=dev.length?dev:ab.slice(0,1)}
  const dia=vDia(d);
  let info,mensal,acts='';
  if(d.kind==='assin'){
    const at=ativa(d);
    mensal=d.valor;
    info=`🔁 Assinatura / recorrente · desde ${mlabel(d.inicio)}${d.fim?' · '+(at?'cobra até ':'encerrada em ')+mlabel(d.fim):' · ativa'}`;
    acts=d.fim?`<button class="mini" onclick="reativar('${d.id}')">Reativar</button>`:`<button class="mini alt" onclick="cancelAss('${d.id}')">Cancelar</button>`;
  }else{
    const rest=d.parcelas.filter(p=>!p.paga);
    mensal=d.parcelas[0].valor;
    info=`${d.n}x · restam ${rest.length} · total ${brl(d.total)} (aberto: ${brl(sumv(rest.map(p=>p.valor)))})`;
  }
  const vtxt=dia?` · vence dia ${dia}`:'';
  const ac=d.auto&&find('contas',d.autoConta);

  const defVenc=dia?'':`<div><button class="mini alt" onclick="editaDivida('${d.id}')">Definir vencimento</button></div>`;
  const linhas=mostra.map(x=>{
    return `<div class="row it"><div><span>${mlabel(x.mes)}${tagItem(x)}</span><br><small>${x.d.kind==='assin'?'🔁 assinatura mensal':'parcela '+(x.i+1)+'/'+x.d.n}${dia?' · vence '+vData(x.mes,dia):''}</small></div>
    <div style="text-align:right"><b>${brl(x.valor)}</b><br>${x.paga?btnDesfaz(d.id,x.pid):`<button class="mini" onclick="pagar('${d.id}','${x.pid}')">PAGAR</button>`}</div></div>`}).join('')
    ||(view?`<div class="it"><small>Sem cobrança em ${mlabel(mesV)}.</small></div>`:`<div class="it"><small class="pos">${d.kind==='parc'?'✓ Quitada':'✓ Em dia'}</small></div>`);
  return `<div class="card"><div class="row"><div><b>${esc(d.nome)}</b><br><b class="neg big">${brl(mensal)}/mês</b><br><small>${esc(d.tipo)}${vtxt}<br>${info}<br>Categoria de saída: ${esc(d.cat||'Outros')}${autoTxt}</small></div>
  <div style="text-align:right">${acts}<br><button class="ic" onclick="editaDivida('${d.id}')" title="Editar">✎</button><button class="ic" onclick="delDivida('${d.id}')">🗑</button></div></div>${defVenc}${linhas}</div>`;
}

    ?`<small>Fatura de ${mlabel(mesV)}</small><div class="v">${brl(rm.total)}</div><small>${rm.nAb} em aberto (${brl(rm.aberto)}) · ${rm.n-rm.nAb} paga${rm.n-rm.nAb===1?'':'s'}</small>`

function salvaDivida(id){
  const d=find('dividas',id),pago=temPago(d),ass=d.kind==='assin',nome=$('en').value.trim();
  if(!nome)return alert('Informe a descrição.');
  const cat=$('ecat').value;
  let venc=d.venc,a={on:false};
  if(!d.cartao){
    venc=lerDia($('ed').value);if(!venc)return alert('Informe o dia do vencimento (1 a 31).');
    a=lerAuto('eauto');if(a===null)return;
  }
  if(!pago){
    const valor=r2(num($('ev').value)),mes=$('em').value;
    if(valor<=0||!mes)return alert('Informe valor e mês da 1ª cobrança.');
    if(ass){d.valor=valor;d.inicio=mes;if(d.fim&&d.fim<mes)d.fim=null}
    else{
      const n=parseInt($('ep').value)||0;if(n<1)return alert('Informe a quantidade de parcelas.');
      d.total=valor;d.n=n;d.parcelas=parcelar(valor,n,mes,0);
    }
  }
  if(!d.cartao){
    d.tipo=$('et').value;d.venc=venc;
    if(a.on&&!d.auto)d.autoDesde=today();
    d.auto=a.on;d.autoConta=a.on?a.conta:null;
  }
  d.nome=nome;d.cat=cat;
  /* pagamentos já feitos só dessa dívida acompanham a nova categoria */
  S.movs.forEach(pm=>{if(pm.pgs&&pm.pgs.length&&pm.pgs.every(p=>p.d===id))pm.cat=cat});
  processaAuto();save();closeModal();render();
}
function delCartao(){
  const c=find('cartoes',cartaoAtual);
  if(!confirm('Remover o cartão "'+c.nome+'" e todas as suas compras e assinaturas?'))return;
  S.dividas=S.dividas.filter(d=>d.cartao!==c.id);
  S.cartoes=S.cartoes.filter(x=>x.id!==c.id);
  save();go('dividas');
}
function addDivida(cid){
  const nome=$('dn').value.trim(),ass=$('dk').value==='assin',valor=r2(num($('dv').value));
  if(!nome||valor<=0)return alert('Preencha descrição e valor.');
  const cat=$('dcat').value;
  let mes,venc=null,a={on:false};
  if(cid){
    const dt=$('dcd').value;if(!dt)return alert('Informe a data da compra.');
    mes=mesFatura(dt,find('cartoes',cid));
  }else{
    mes=$('dm').value;if(!mes)return alert('Informe o mês da 1ª cobrança.');
    venc=lerDia($('dvd').value);if(!venc)return alert('Informe o dia do vencimento (1 a 31).');
    a=lerAuto('dauto');if(a===null)return;
  }
  const tipo=cid?'Cartão de crédito':$('dtp').value,base={id:uid(),nome,tipo,cat,cartao:cid||null};
  if(!cid){
    base.venc=venc;
    if(a.on){base.auto=true;base.autoConta=a.conta;base.autoDesde=today()}
  }
  if(ass)S.dividas.push({...base,kind:'assin',valor,inicio:mes,fim:null,pagos:{}});
  else{
    const n=parseInt($('dnp').value)||0,pg=parseInt($('dpg').value)||0;
    if(n<1)return alert('Informe a quantidade de parcelas.');
    if(pg<0||pg>=n)return alert('As parcelas já pagas devem ser menos que o total.');
    S.dividas.push({...base,kind:'parc',total:valor,n,parcelas:parcelar(valor,n,mes,pg)});
  }
  processaAuto();save();render();
}

/* pagamento (parcela, assinatura ou fatura): vira saída na categoria de cada dívida */
function valorKey(did,pid){
  const d=find('dividas',did);if(!d)return 0;
  if(d.kind==='assin')return d.valor;
  const p=d.parcelas.find(x=>x.id===pid);return p?p.valor:0;
}
function rotulo(d,pid){
  if(d.kind==='assin')return mlabel(pid);
  const i=d.parcelas.findIndex(p=>p.id===pid);return (i+1)+'/'+d.n;
}
function pagar(did,pid){
  const d=find('dividas',did);
  abrirPag([[did,pid]],'Pagamento: '+d.nome+' ('+rotulo(d,pid)+')',valorKey(did,pid));
}
function pagarFatura(cid,mes){
  const c=find('cartoes',cid),L2=itens(d=>d.cartao===cid,ateM(mes)).filter(x=>x.mes===mes&&!x.paga);
  abrirPag(L2.map(x=>[x.d.id,x.pid]),'Fatura '+c.nome+' · '+mlabel(mes),sumv(L2.map(x=>x.valor)));
}
function abrirPag(keys,titulo,valor){
  PG={keys,titulo,valor};
  const cats=[...new Set(keys.map(([did])=>{const d=find('dividas',did);return d?(d.cat||'Outros'):null}).filter(Boolean))];
  openModal(`<h3 style="margin-top:0">Pagar</h3><div class="card"><b>${esc(titulo)}</b>
  <div style="font-size:22px;font-weight:700">${fmt(valor)}</div>
  <small>Entra nas Saídas em: ${esc(cats.join(', ')||'Outros')}${cats.length>1?' (uma saída por categoria)':''}</small></div>
  <small>Pagar com</small><select id="pm" onchange="updPg()"><option value="conta">🏦 Conta bancária</option><option value="dinheiro">💵 Dinheiro</option></select>
  <div id="pc"></div><input id="pd" type="date" value="${today()}">
  <button class="add" onclick="execPag()">Confirmar pagamento</button><button class="add cancel" onclick="closeModal()">Cancelar</button>`);
  updPg();
}
function updPg(){
  $('pc').innerHTML=$('pm').value==='conta'?(S.contas.length?`<select id="pcs">${opts(S.contas,x=>esc(x.nome)+' ('+fmt(x.valor)+')')}</select>`:'<p class="warn">Cadastre antes uma conta bancária.</p>'):'';
}
/* paga cobranças: debita a conta/dinheiro, marca como pagas e registra uma saída por categoria */
function liquida(keys,titulo,data,meio,cid,auto){
  const g={};
  keys.forEach(([did,pid])=>{const d=find('dividas',did);if(!d)return;const cat=d.cat||'Outros';(g[cat]=g[cat]||[]).push([did,pid])});
  const cats=Object.keys(g);
  cats.forEach(cat=>{
    const ks=g[cat],val=sumv(ks.map(([a,b])=>valorKey(a,b)));
    const m={id:uid(),tipo:'out',desc:cats.length>1?titulo+' · '+cat:titulo,valor:val,data,meio,cat,pgs:ks.map(([d,p])=>({d,p}))};
    if(auto)m.autoDeb=1;
    if(cid)m.ref=cid;
    efeito(m,1);
    ks.forEach(([did,pid])=>{
      const d=find('dividas',did);
      if(d.kind==='assin')d.pagos[pid]=data;
      else{const p=d.parcelas.find(x=>x.id===pid);if(p){p.paga=true;p.dataPg=data}}
    });
    S.movs.push(m);
  });
}
function execPag(){
  const meio=$('pm').value,data=$('pd').value;
  if(!data)return alert('Informe a data.');
  if(data>today())return alert('A data do pagamento não pode ser futura. Pague no dia do vencimento ou marque o débito automático.');
  let cid=null;
  if(meio==='conta'){
    if(!$('pcs'))return alert('Cadastre uma conta antes.');
    cid=$('pcs').value;const c=find('contas',cid);
    if(c.valor<PG.valor&&!confirm('O saldo da conta é menor que o valor. Continuar?'))return;
  }else if(S.dinheiro<PG.valor&&!confirm('O saldo em dinheiro é menor que o valor. Continuar?'))return;
  liquida(PG.keys,PG.titulo,data,meio,cid,false);
  save();closeModal();render();
}
/* desfazer um pagamento: a cobrança volta a ficar em aberto e o débito automático não a refaz */
function desfazPag(m){
  (m.pgs||[]).forEach(({d:did,p:pid})=>{
    const d=find('dividas',did);if(!d)return;
    if(d.kind==='assin'){delete d.pagos[pid];d.noAuto=d.noAuto||{};d.noAuto[pid]=1}
    else{const p=d.parcelas.find(x=>x.id===pid);if(p){p.paga=false;delete p.dataPg;p.noAuto=true}}
  });
}
function desfazerPagDiv(did,pid){
  const m=S.movs.find(x=>(x.pgs||[]).some(p=>p.d===did&&p.p===pid));
  if(!m)return alert('Pagamento não encontrado.');
  const n=m.pgs.length;
  let msg=n>1?'Esta cobrança foi paga junto com outras ('+n+' cobranças no mesmo pagamento). Desfazer reverte o pagamento de todas elas e devolve o valor à conta. Continuar?':'Desfazer este pagamento? O valor volta para a conta ou para o dinheiro.';
  if(m.autoDeb)msg+='\n\nO débito automático não será refeito para esta cobrança: pague manualmente quando quiser.';
  if(!confirm(msg))return;
  efeito(m,-1);desfazPag(m);S.movs=S.movs.filter(x=>x.id!==m.id);save();render();
}
const temPago=d=>d.kind==='assin'?Object.keys(d.pagos).length>0:d.parcelas.some(p=>p.paga);

/* ---------- DÉBITO AUTOMÁTICO DE DÍVIDAS E CARTÕES ---------- */
function noAutoItem(d,pid){
  if(d.kind==='assin')return !!(d.noAuto&&d.noAuto[pid]);
  const p=d.parcelas.find(x=>x.id===pid);return !!(p&&p.noAuto);
}
/* paga sozinho, na data de vencimento, as cobranças marcadas com débito automático.
   Só vale a partir do dia em que o débito automático foi marcado (autoDesde). */
function processaAuto(){
  const hoje=today(),G={};
  S.dividas.forEach(d=>{
    const k=d.cartao?find('cartoes',d.cartao):null,cfg=k||d;
    if(!cfg||!cfg.auto||!cfg.autoConta||!find('contas',cfg.autoConta))return;
    itens(x=>x.id===d.id).forEach(x=>{
      if(x.paga||noAutoItem(d,x.pid))return;
      const du=dueOf(d,x.mes);
      if(!du||du>hoje||du<(cfg.autoDesde||''))return;
      const key=k?'k:'+k.id+':'+x.mes:'d:'+d.id+':'+x.pid;
      (G[key]=G[key]||{k,d,x,du,conta:cfg.autoConta,ks:[]}).ks.push([d.id,x.pid]);
    });
  });
  const keys=Object.keys(G);
  keys.forEach(key=>{
    const g=G[key];
    const titulo=g.k?'Fatura '+g.k.nome+' · '+mlabel(g.x.mes):'Pagamento: '+g.d.nome+' ('+rotulo(g.d,g.x.pid)+')';
    liquida(g.ks,titulo,g.du,'conta',g.conta,true);
  });
  return keys.length>0;
}

/* ---------- ENTRADAS RECORRENTES AUTOMÁTICAS + LANÇAMENTOS FUTUROS ---------- */
function destOk(d,tp){
  if(d==='dinheiro')return true;
  const [k,id]=String(d||'').split(':');
  if(k==='c')return !!find('contas',id);
  if(k==='i'&&tp==='in'){const i=find('inv',id);return !!i&&i.tipo!=='Ações'}
  return false;
}
const recCompleta=(c,tp)=>!!(c.rec&&c.valor>0&&c.dia&&c.dest&&destOk(c.dest,tp));
const iniRec=dia=>dia>=parseInt(today().slice(8,10))?cur():addM(cur(),1);
function destLabel(d){
  if(d==='dinheiro')return '💵 Dinheiro';
  const [k,id]=String(d||'').split(':');
  if(k==='c'){const c=find('contas',id);return c?'🏦 '+c.nome:'(conta removida)'}
  if(k==='i'){const i=find('inv',id);return i?'📈 '+i.nome:'(investimento removido)'}
  return '';
}
function destOpts(){
  return '<option value="dinheiro">💵 Dinheiro (em espécie)</option>'
   +S.contas.map(c=>`<option value="c:${c.id}">🏦 ${esc(c.nome)}</option>`).join('')
   +S.inv.filter(x=>x.tipo!=='Ações').map(i=>`<option value="i:${i.id}">📈 ${esc(i.nome)}</option>`).join('');
}
function aplicaDest(m,dest){
  delete m.ref;delete m.rend;
  const [k,id]=String(dest).split(':');
  if(dest==='dinheiro')m.meio='dinheiro';
  else if(k==='c'){m.meio='conta';m.ref=id}
  else{m.meio='rend';m.rend=id}
}
/* cria as entradas recorrentes que faltam e realiza as futuras cuja data chegou */
function processaRec(){
  let mud=false;const hoje=today();
  S.cats.in.forEach(c=>{
    if(!recCompleta(c,'in')||!c.ini)return;
    c.gen=c.gen||{};
    for(let mes=c.ini;mes<=cur();mes=addM(mes,1)){
      if(c.gen[mes])continue;
      const m={id:uid(),tipo:'in',desc:c.nome,valor:c.valor,data:dataMes(mes,c.dia),cat:c.nome,rcat:c.id,rmes:mes};
      aplicaDest(m,c.dest);
      if(m.data>hoje)m.pend=true;else efeito(m,1);
      S.movs.push(m);c.gen[mes]=1;mud=true;
    }
  });
  S.movs.forEach(m=>{if(m.pend&&m.data<=hoje){delete m.pend;efeito(m,1);mud=true}});
  return mud;
}
function atualizaAuto(){
  const a=processaRec(),b=processaAuto();
  if(!(a||b))return;
  save();
  const el=document.activeElement;
  if(!locked&&route!=='editmov'&&!$('modal').innerHTML&&!(el&&/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)))render();
}

function formCat(tp,id){
  const c=id?catsDe(tp).find(x=>x.id===id):null;

}
function updCat(tp){
  const rec=tp==='in'&&$('cnr').value==='1';
  $('cnv').placeholder=rec?'Valor do lançamento (obrigatório)':'Valor usual (opcional)';
  $('cnx').innerHTML=rec?`<small>Dia do mês em que o dinheiro entra (1 a 31)</small>
  <input id="cnd" type="number" min="1" max="31" inputmode="numeric" placeholder="Dia do mês">

  <p class="sub">O lançamento é feito sozinho na data e entra direto no saldo da conta, do dinheiro ou do investimento escolhido. Se o dia deste mês já passou, o primeiro lançamento automático é no mês seguinte (para não duplicar algo que você já tenha lançado).</p>`:'';
}
function salvaCat(tp,id){
  const nome=$('cnn').value.trim();if(!nome)return alert('Informe o nome da categoria.');
  const rec=tp==='in'&&$('cnr').value==='1',valor=r2(num($('cnv').value));
  const L2=catsDe(tp),ex=id?L2.find(c=>c.id===id):null;
  const dup=L2.some(c=>c.id!==id&&c.nome.toLowerCase()===nome.toLowerCase())||(tp==='in'&&nome.toLowerCase()==='rendimento de investimento');
  if(dup)return alert('Já existe uma categoria com esse nome.');
  let dia=0,dest='';
  if(rec){
    dia=lerDia($('cnd').value);dest=$('cnt').value;
    if(valor<=0||!dia||!dest)return alert('Para lançar automaticamente, informe o valor, o dia do mês e onde o dinheiro entra.');
  }
  let c=ex;
  if(c){
    if(c.nome!==nome){
      S.movs.forEach(m=>{if(m.tipo===tp&&m.cat===c.nome){if(m.rcat&&m.desc===c.nome)m.desc=nome;m.cat=nome}});
      if(tp==='out')S.dividas.forEach(d=>{if(d.cat===c.nome){if(d.nome===c.nome)d.nome=nome;d.cat=nome}});
    }
    const eraRec=c.rec&&c.ini;
    Object.assign(c,{nome,rec,valor,dia,dest});
    if(!rec)delete c.ini;
    else if(!eraRec)c.ini=iniRec(dia);
  }else{
    c={id:uid(),nome,rec,valor,dia,dest};
    if(rec)c.ini=iniRec(dia);
    S.cats[tp].push(c);
  }
  if(rec)S.movs.forEach(m=>{if(m.rcat===c.id&&m.pend){m.valor=c.valor;m.data=dataMes(m.rmes,c.dia);aplicaDest(m,c.dest)}});
  processaRec();save();refreshCats(tp,c.id);modalCats(tp);
}
function delCat(tp,id){
  const c=catsDe(tp).find(x=>x.id===id);
  if(!c||!confirm('Remover a categoria "'+c.nome+'"? Os registros antigos continuam com esse nome.'))return;
  S.cats[tp]=S.cats[tp].filter(x=>x.id!==id);save();refreshCats(tp);modalCats(tp);
}
